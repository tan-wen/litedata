name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Unit and real MySQL integration tests
        run: bash ./mvnw --batch-mode --no-transfer-progress verify
      - name: Validate fixed engine deployment
        run: docker compose --env-file .env.example config --quiet
      - name: Validate chemical park example
        run: python3 -m unittest discover -s examples/chemical-park -p 'test_*.py'
      - name: Validate metric lineage interaction
        run: node --test src/test/js/metric-lineage-graph.test.cjs

