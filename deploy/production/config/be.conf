storage_root_path = /opt/apache-doris/be/storage
# Absolute limit: leaves room below 72GiB cgroup for JNI and transient allocation.
mem_limit = 60G
sys_log_level = INFO
sys_log_roll_num = 10
sys_log_roll_mode = SIZE-MB-256
base_compaction_num_threads_per_disk = 2
cumulative_compaction_num_threads_per_disk = 4
