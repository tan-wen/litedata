# Appended after the upstream non-CI defaults. JVM options are patched in start-doris.sh.
meta_dir = /opt/apache-doris/fe/doris-meta
default_replication_num = 1
sys_log_level = INFO
sys_log_mode = ASYNC
sys_log_roll_num = 10
log_roll_size_mb = 256
sys_log_delete_age = 7d
audit_log_roll_num = 20
audit_log_delete_age = 14d
qe_max_connection = 512
qe_query_timeout_second = 300
