<!doctype html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/layout :: layout(~{::title}, ~{::section})}">
<head><title>维护字典项 · LiteData</title></head>
<body><section>
  <header class="page-topbar">
    <div th:replace="~{fragments/workspace :: context}"></div>
    <div class="page-heading d-flex flex-wrap justify-content-between align-items-start gap-5">
    <div><h1 class="page-title" th:text="${dictionary.name}"></h1><p class="page-subtitle mb-0" th:text="${dictionary.description}"></p></div>
    <a class="btn-solid theme-primary" th:href="@{/dictionaries/{code}/items/new(code=${dictionary.code},pageNum=${pageNum},pageSize=${pageSize},keyword=${keyword})}">新增字典项</a>

    <a th:replace="~{fragments/workspace :: back}"></a>
  </div>
  </header>
  <div th:replace="~{fragments/messages :: messages}"></div>
  <p class="fg-2 small">编码用于绑定，创建后固定；名称可以调整。停用后不再供新资产选择，已有绑定仍显示。排序数字越小越靠前。</p>
  <article class="workspace-section">
    <div class="card-header">字典项列表</div>
    <div class="card-body"><form class="d-flex gap-3" method="get" th:action="@{/dictionaries/{code}/items(code=${dictionary.code})}">
      <input type="hidden" name="pageSize" th:value="${pageSize}"><input class="form-control" name="keyword" aria-label="搜索字典项" maxlength="100" th:value="${keyword}" placeholder="编码、名称或说明">
      <button class="btn-solid theme-primary text-nowrap" type="submit">查询</button><a class="btn-link theme-primary text-nowrap" th:href="@{/dictionaries/{code}/items(code=${dictionary.code})}">重置</a>
    </form></div>
    <div class="table-responsive"><table class="table table-hover mb-0">
      <thead><tr><th>名称 / 编码</th><th>说明</th><th>排序</th><th>状态</th><th>操作</th></tr></thead>
      <tbody><tr th:each="item : ${items}">
        <td><span th:text="${item.label}"></span><div class="small fg-2" th:text="${item.value}"></div></td><td th:text="${item.description}"></td><td th:text="${item.sortOrder}"></td>
        <td><span class="badge" th:classappend="${item.enabled ? 'theme-success' : 'theme-secondary'}" th:text="${item.enabled ? '启用' : '停用'}"></span></td>
        <td><div class="d-flex gap-2">
          <a class="btn-outline theme-primary btn-sm" th:href="@{/dictionaries/{code}/items/{id}/edit(code=${dictionary.code},id=${item.id},pageNum=${pageNum},pageSize=${pageSize},keyword=${keyword})}">编辑</a>
          <form method="post" th:action="@{/dictionaries/{code}/items/{id}/delete(code=${dictionary.code},id=${item.id})}">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><input type="hidden" name="version" th:value="${item.version}">
            <input type="hidden" name="pageNum" th:value="${pageNum}"><input type="hidden" name="pageSize" th:value="${pageSize}"><input type="hidden" name="keyword" th:value="${keyword}">
            <button class="btn-outline theme-danger btn-sm" type="submit">删除</button>
          </form>
        </div></td>
      </tr><tr th:if="${#lists.isEmpty(items)}"><td colspan="5" class="text-center fg-2 py-10">暂无字典项。可根据行业新增业务主题域等标准选项。</td></tr></tbody>
    </table></div>
  </article>
  <div th:replace="~{fragments/pagination :: pagination}"></div>
  <a class="btn-link theme-secondary mt-5" th:href="@{/dictionaries}">返回数据字典</a>
</section></body></html>
