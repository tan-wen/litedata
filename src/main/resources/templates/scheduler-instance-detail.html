<!doctype html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/layout :: layout(~{::title}, ~{::section})}">
<head><title>节点与日志 · LiteData</title></head><body><section>
  <link rel="stylesheet" th:href="@{/css/scheduler-console.css}">
  <div class="d-flex flex-wrap justify-content-between align-items-start gap-5 mb-7"><div><div class="page-kicker">调度运维 / <a th:href="${resource.path()}" th:text="${resource.name}"></a></div><h1 class="page-title">节点与执行日志</h1><p class="page-subtitle mb-0">选择节点查看该次执行的日志，失败节点优先展开。</p></div><div class="d-flex gap-3"><button class="btn-outline theme-primary" type="button" onclick="location.reload()">刷新状态</button><a class="btn-outline theme-secondary" th:href="${resource.path()}">返回实例</a></div></div>
  <div th:if="${engineError}" class="alert theme-warning" role="alert" th:text="${engineError}"></div>
  <th:block th:if="${instance != null}">
    <article class="platform-card card mb-5"><div class="card-body"><div class="scheduler-summary">
      <div><div class="small fg-2 mb-2">工作流实例</div><strong th:text="${'#' + instance.id}"></strong></div>
      <div><div class="small fg-2 mb-2">执行状态</div><span class="badge" th:classappend="${instance.state == 'SUCCESS' ? 'theme-success' : instance.state == 'FAILURE' ? 'theme-danger' : 'theme-info'}" th:text="${statusLabels[instance.state] ?: instance.state}"></span></div>
      <div><div class="small fg-2 mb-2">开始 / 结束（引擎时间）</div><span th:text="${instance.startedAt}"></span><div class="fg-2" th:text="${#strings.isEmpty(instance.finishedAt) ? '尚未结束' : instance.finishedAt}"></div></div>
      <div><div class="small fg-2 mb-2">运行次数 / 节点数</div><strong th:text="${instance.runTimes + ' / ' + #lists.size(nodes)}"></strong></div>
    </div></div></article>
    <div class="scheduler-workspace">
      <article class="platform-card card scheduler-node-panel"><div class="card-header">执行节点</div><div class="card-body p-0"><nav aria-label="执行节点选择" class="scheduler-node-list">
        <a th:each="node : ${nodes}" class="scheduler-node" th:classappend="${selectedNode != null and selectedNode.id == node.id} ? 'is-selected'" th:attr="aria-current=${selectedNode != null and selectedNode.id == node.id ? 'true' : null}" th:href="${resource.path() + '/instances/' + instance.id + '?taskId=' + node.id}"><strong th:text="${node.name}"></strong><div class="d-flex flex-wrap gap-2 align-items-center mt-2"><span class="badge" th:classappend="${node.state == 'SUCCESS' ? 'theme-success' : node.state == 'FAILURE' ? 'theme-danger' : 'theme-info'}" th:text="${statusLabels[node.state] ?: node.state}"></span><small class="fg-2" th:text="${'重试 ' + node.retryTimes + ' 次 · #' + node.id}"></small></div><small class="fg-2 d-block mt-2" th:text="${node.startedAt}"></small></a>
      </nav><p th:if="${#lists.isEmpty(nodes)}" class="fg-2 p-5 mb-0">尚未派发节点，或节点正在等待上游。请稍后刷新状态。</p></div></article>
      <article class="platform-card card scheduler-log-panel" th:if="${selectedNode != null}" data-log-console th:attr="data-log-url=${logUrl}">
        <div class="card-header"><span th:text="${selectedNode.name}"></span><small class="fw-normal fg-2 ms-3">节点日志</small></div>
        <div class="card-body">
          <div class="scheduler-log-toolbar"><button class="btn-solid theme-primary btn-sm" type="button" data-log-load>加载下一段</button><button class="btn-outline theme-secondary btn-sm" type="button" data-log-reset>从头读取</button><button class="btn-outline theme-secondary btn-sm" type="button" data-log-download disabled>下载已加载日志</button><label><input class="check" type="checkbox" data-log-auto> 每 5 秒刷新</label><label><input class="check" type="checkbox" data-log-follow checked> 跟随底部</label></div>
          <label class="form-label mt-5" for="log-filter">检索已加载日志</label><input class="form-control" type="search" id="log-filter" data-log-filter placeholder="输入关键字筛选已加载的行" maxlength="200">
          <div class="d-flex justify-content-between gap-3 small fg-2 my-3"><span data-log-status role="status" aria-live="polite">准备读取日志…</span><span data-log-count>已读取 0 行</span></div>
          <div class="alert theme-warning" data-log-error role="alert" hidden></div>
          <pre class="scheduler-log-output" data-log-output tabindex="0" aria-label="执行日志内容"></pre>
          <p class="small fg-2 mt-3 mb-0">每批最多读取 200 行，当前窗口保留最近 10000 行。配置敏感行与连接地址已隐藏；下载与检索仅覆盖当前已加载窗口。节点尚未派发或日志已清理时可能暂不可读。</p>
          <noscript><p class="alert theme-info mt-3">请启用 JavaScript 以分段读取节点日志。</p></noscript>
        </div>
      </article>
      <article th:if="${!canEdit}" class="platform-card card"><div class="card-body fg-2">当前账号可查看运行状态。节点执行日志仅向管理员和开发者开放。</div></article>
    </div>
  </th:block>
  <script th:src="@{/js/scheduler-console.js}" defer></script>
</section></body></html>
