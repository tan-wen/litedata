<!doctype html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/layout :: layout(~{::title}, ~{::section})}">
<head><title>数据服务 · 数据中台</title></head>
<body><section>
  <div class="d-flex justify-content-between align-items-start mb-7 gap-5"><div><h1 class="page-title">数据服务</h1><p class="page-subtitle mb-0">将 Doris 只读 SQL 发布为受控 API；命名参数如 <code>:customerId</code> 自动成为请求参数。</p></div><a th:if="${canEdit}" class="btn-solid theme-primary" th:href="@{/services/new}">创建数据服务</a></div>
  <div th:replace="~{fragments/messages :: messages}"></div>
  <article class="platform-card card"><div class="card-header">已配置服务 <small class="fw-normal fg-2">日调用量按 Asia/Shanghai 当天统计，包含成功和失败请求</small></div><div class="card-body p-0"><div class="table-responsive"><table class="table table-hover mb-0"><thead><tr><th>名称</th><th>服务标识</th><th>查询语句</th><th>日调用量</th><th>状态</th><th>操作</th></tr></thead><tbody><tr th:each="service : ${services}" th:id="${'service-' + service.id}"><td class="fw-semibold" th:text="${service.name}">客户查询</td><td><code th:text="${service.slug}">customers</code></td><td class="text-truncate" style="max-width:290px" th:text="${service.querySql}">SELECT * FROM customers</td><td th:text="${service.dailyCalls}">0</td><td><span class="badge" th:classappend="${service.published} ? ' theme-success' : ' theme-secondary'" th:text="${service.published} ? '已发布' : '草稿'">草稿</span></td><td><div class="d-flex flex-wrap gap-1"><a th:if="${canEdit}" class="btn-link theme-primary btn-sm" th:href="@{/services/{id}/edit(id=${service.id})}">编辑</a><a class="btn-outline theme-info btn-sm" th:href="@{/services/{id}/calls(id=${service.id})}">调用记录</a><form th:if="${canEdit}" th:action="@{/services/{id}/publish(id=${service.id})}" method="post"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><button class="btn-outline theme-primary btn-sm" type="submit" th:text="${service.published} ? '下线' : '发布'">发布</button></form><form th:if="${canManageUsers}" th:action="@{/services/{id}/credentials(id=${service.id})}" method="post"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><button class="btn-outline theme-secondary btn-sm" type="submit">生成密钥</button></form></div></td></tr><tr th:if="${#lists.isEmpty(services)}"><td colspan="6" class="text-center fg-2 py-7">暂无服务，创建后发布即可调用。</td></tr></tbody></table></div></div></article>
  <div th:replace="~{fragments/pagination :: pagination}"></div>
</section></body>
</html>
