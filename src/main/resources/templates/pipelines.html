<!doctype html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/layout :: layout(~{::title}, ~{::section})}">
<head><title>同步管道 · 数据中台</title></head>
<body>
<section>
  <div class="mb-4"><div class="page-kicker">数据开发 / 同步管道</div><h1 class="page-title">同步管道</h1><p class="page-subtitle mb-0">以 Watermark 列进行每小时增量同步，写入 Doris 后执行 SQL 加工。</p></div>
  <div th:replace="~{fragments/messages :: messages}"></div>
  <article class="platform-card card mb-3"><div class="card-header">已配置管道</div><div class="card-body p-0"><div class="table-responsive"><table class="table table-hover mb-0"><thead><tr><th>名称</th><th>来源表</th><th>目标表</th><th>调度表达式</th><th>状态</th><th>最近错误</th><th>操作</th></tr></thead><tbody><tr th:each="pipeline : ${pipelines}"><td class="fw-semibold" th:text="${pipeline.name}">订单同步</td><td th:text="${pipeline.sourceTable}">orders</td><td th:text="${pipeline.targetTable}">ods_orders</td><td th:text="${pipeline.cronExpression}">0 0 * * * ?</td><td><span class="badge status status-info" th:text="${pipeline.status}">READY</span></td><td class="text-danger text-truncate" style="max-width:160px" th:text="${pipeline.lastError}">-</td><td><div class="d-flex gap-1"><form th:if="${canEdit}" th:action="@{/pipelines/{id}/run(id=${pipeline.id})}" method="post"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><button class="btn btn-sm btn-outline-primary" type="submit">立即运行</button></form><form th:if="${canEdit}" th:action="@{/pipelines/{id}/schedule(id=${pipeline.id})}" method="post"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><button class="btn btn-sm btn-outline-secondary" type="submit">提交调度</button></form></div></td></tr><tr th:if="${#lists.isEmpty(pipelines)}"><td colspan="7" class="text-center text-secondary py-4">尚无同步管道。</td></tr></tbody></table></div></div></article>
  <div class="row g-3 align-items-start"><div class="col-xl-7"><article class="platform-card card"><div class="card-header">创建同步管道</div><div class="card-body"><form th:if="${canEdit}" th:action="@{/pipelines}" method="post"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><div class="row g-3"><div class="col-md-6"><label class="form-label" for="name">管道名称</label><input class="form-control" id="name" name="name" required maxlength="100"></div><div class="col-md-6"><label class="form-label" for="sourceId">来源数据源</label><select class="form-select" id="sourceId" name="sourceId" required><option value="">请选择</option><option th:each="source : ${sources}" th:value="${source.id}" th:text="${source.name}">业务主库</option></select></div><div class="col-md-6"><label class="form-label" for="sourceTable">来源表</label><input class="form-control" id="sourceTable" name="sourceTable" required placeholder="orders"></div><div class="col-md-6"><label class="form-label" for="targetTable">Doris 目标表</label><input class="form-control" id="targetTable" name="targetTable" required placeholder="ods_orders"></div><div class="col-md-6"><label class="form-label" for="watermarkColumn">Watermark 列</label><input class="form-control" id="watermarkColumn" name="watermarkColumn" required placeholder="updated_at"></div><div class="col-md-6"><label class="form-label" for="cronExpression">调度表达式</label><input class="form-control" id="cronExpression" name="cronExpression" required value="0 0 * * * ?"><div class="form-text">默认每小时整点执行。</div></div><div class="col-12"><label class="form-label" for="transformSql">同步后加工 SQL（可选）</label><textarea class="form-control code-preview" id="transformSql" name="transformSql" rows="5" placeholder="INSERT INTO dwd_orders SELECT ... FROM ods_orders"></textarea><div class="form-text">仅同步到 ODS 时留空；多层加工请在“SQL 加工任务”中配置。</div></div></div><button class="btn btn-primary mt-3" type="submit">创建管道</button></form></div></article></div>
  <div class="col-xl-5"><article class="platform-card card"><div class="card-header">近期运行记录</div><div class="card-body p-0"><div class="table-responsive"><table class="table table-sm mb-0"><thead><tr><th>管道</th><th>状态</th><th>时间</th><th>消息</th></tr></thead><tbody><tr th:each="run : ${runs}"><td th:text="${run.pipelineName}">订单同步</td><td><span class="badge status status-info" th:text="${run.status}">SUCCESS</span></td><td th:text="${run.startedAt}">-</td><td class="text-truncate" style="max-width:140px" th:text="${run.message}">完成</td></tr><tr th:if="${#lists.isEmpty(runs)}"><td colspan="4" class="text-center text-secondary py-4">尚无运行记录。</td></tr></tbody></table></div></div></article></div></div>
</section>
</body>
</html>
