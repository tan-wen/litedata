<!doctype html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/layout :: layout(~{::title}, ~{::section})}">
<head><title>同步管道 · 数据中台</title></head>
<body><section>
  <div class="d-flex justify-content-between align-items-start mb-7 gap-5"><div><div class="page-kicker">数据开发 / 同步管道</div><h1 class="page-title">同步管道</h1><p class="page-subtitle mb-0">以 Watermark 列进行每小时增量同步，写入 Doris 后执行 SQL 加工。</p></div><a th:if="${canEdit}" class="btn-solid theme-primary" th:href="@{/pipelines/new}">创建同步管道</a></div>
  <div th:replace="~{fragments/messages :: messages}"></div>
  <article class="platform-card card mb-5"><div class="card-header">已配置管道</div><div class="card-body p-0"><div class="table-responsive"><table class="table table-hover mb-0"><thead><tr><th>名称</th><th>来源表</th><th>目标表</th><th>调度表达式</th><th>状态</th><th>最近错误</th><th>操作</th></tr></thead><tbody><tr th:each="pipeline : ${pipelines}" th:id="${'pipeline-' + pipeline.id}"><td class="fw-semibold" th:text="${pipeline.name}">订单同步</td><td th:text="${pipeline.sourceTable}">orders</td><td th:text="${pipeline.targetTable}">ods_orders</td><td th:text="${pipeline.cronExpression}">0 0 * * * ?</td><td><span class="badge theme-info" th:text="${pipeline.status}">READY</span></td><td class="fg-danger text-truncate" style="max-width:160px" th:text="${pipeline.lastError}">-</td><td><div class="d-flex flex-wrap gap-1"><a th:if="${canEdit}" class="btn-link theme-primary btn-sm" th:href="@{/pipelines/{id}/edit(id=${pipeline.id})}">编辑</a><form th:if="${canEdit}" th:action="@{/pipelines/{id}/run(id=${pipeline.id})}" method="post"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><button class="btn-outline theme-primary btn-sm" type="submit">立即运行</button></form><form th:if="${canEdit}" th:action="@{/pipelines/{id}/schedule(id=${pipeline.id})}" method="post"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><button class="btn-outline theme-secondary btn-sm" type="submit">提交调度</button></form></div></td></tr><tr th:if="${#lists.isEmpty(pipelines)}"><td colspan="7" class="text-center fg-2 py-7">尚无同步管道。</td></tr></tbody></table></div></div></article>
  <div class="mb-7" th:replace="~{fragments/pagination :: pagination}"></div>
  <article class="platform-card card"><div class="card-header">近期运行记录</div><div class="card-body p-0"><div class="table-responsive"><table class="table table-sm mb-0"><thead><tr><th>管道</th><th>状态</th><th>时间</th><th>消息</th></tr></thead><tbody><tr th:each="run : ${runs}"><td th:text="${run.pipelineName}">订单同步</td><td><span class="badge theme-info" th:text="${run.status}">SUCCESS</span></td><td th:text="${run.startedAt}">-</td><td class="text-truncate" style="max-width:140px" th:text="${run.message}">完成</td></tr><tr th:if="${#lists.isEmpty(runs)}"><td colspan="4" class="text-center fg-2 py-7">尚无运行记录。</td></tr></tbody></table></div></div></article>
</section></body>
</html>
