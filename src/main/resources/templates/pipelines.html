<!doctype html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/layout :: layout(~{::title}, ~{::section})}">
<head><title>同步管道 · 数据中台</title></head><body><section>
  <div class="d-flex flex-wrap justify-content-between align-items-start mb-7 gap-5"><div><h1 class="page-title">同步管道</h1><p class="page-subtitle mb-0">仅将源数据同步至已登记的 ODS UNIQUE 模型；SQL 加工请创建独立任务并从末端调度。</p></div><a th:if="${canEdit}" class="btn-solid theme-primary" th:href="@{/pipelines/new}">创建同步管道</a></div>
  <div th:replace="~{fragments/messages :: messages}"></div>
  <article class="platform-card card mb-5"><div class="card-header">同步任务</div><div class="card-body p-0"><div class="table-responsive"><table class="table table-hover mb-0">
    <thead><tr><th>名称 / 数据流向</th><th>执行周期</th><th>调度状态</th><th>执行状态</th><th>最近错误</th><th>操作</th></tr></thead><tbody>
    <tr th:each="pipeline : ${pipelines}" th:id="${'pipeline-' + pipeline.id}">
      <td><a class="fw-semibold" th:href="@{/pipelines/{id}/runs(id=${pipeline.id})}" th:text="${pipeline.name}"></a><div class="small fg-2 mt-2"><span th:text="${pipeline.sourceTable}"></span> → <span th:text="${pipeline.targetTable}"></span></div></td>
      <td><code th:text="${pipeline.cronExpression}"></code><small class="fg-2 d-block">北京时间</small></td>
      <td><span class="badge" th:classappend="${pipeline.status == 'SCHEDULED' ? 'theme-success' : 'theme-info'}" th:text="${pipeline.status == 'SCHEDULED' ? '已启用' : pipeline.status == 'PAUSED' ? '已停用' : pipeline.status == 'SCHEDULE_PENDING' ? '待上线' : '未启用'}"></span></td>
      <td><span class="badge" th:classappend="${pipeline.activeRunId != null ? 'theme-warning' : 'theme-info'}" th:text="${pipeline.activeRunId != null ? '运行中' : '空闲'}"></span></td>
      <td class="fg-danger" style="max-width:16rem;overflow-wrap:anywhere" th:text="${pipeline.lastError}"></td>
      <td><div class="d-flex flex-wrap gap-2">
        <a class="btn-outline theme-secondary btn-sm" th:href="@{/pipelines/{id}/runs(id=${pipeline.id})}">同步记录</a>
        <a class="btn-outline theme-primary btn-sm" th:href="@{/scheduling/pipeline/{id}(id=${pipeline.id})}">实例 / 日志</a>
        <a th:if="${canEdit}" class="btn-link theme-primary btn-sm" th:href="@{/pipelines/{id}/edit(id=${pipeline.id})}">编辑</a>
        <form th:if="${canEdit}" th:action="@{/pipelines/{id}/run(id=${pipeline.id})}" method="post"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><button class="btn-outline theme-primary btn-sm" type="submit" th:disabled="${pipeline.activeRunId != null}">立即运行</button></form>
        <form th:if="${canEdit and pipeline.status != 'SCHEDULED' and pipeline.status != 'SCHEDULE_PENDING'}" th:action="@{/pipelines/{id}/schedule(id=${pipeline.id})}" method="post"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><button class="btn-outline theme-secondary btn-sm" type="submit" th:disabled="${pipeline.activeRunId != null}">启用定时</button></form>
        <form th:if="${canEdit and (pipeline.status == 'SCHEDULED' or pipeline.status == 'SCHEDULE_PENDING')}" th:action="@{/pipelines/{id}/pause(id=${pipeline.id})}" method="post"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><button class="btn-outline theme-secondary btn-sm" type="submit">停用定时</button></form>
      </div></td>
    </tr>
    <tr th:if="${#lists.isEmpty(pipelines)}"><td colspan="6" class="text-center fg-2 py-7">尚无同步管道。创建后可手动运行或启用定时。</td></tr>
  </tbody></table></div></div></article>
  <div class="mb-7" th:replace="~{fragments/pagination :: pagination}"></div>
</section></body></html>
