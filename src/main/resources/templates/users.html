<!doctype html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/layout :: layout(~{::title}, ~{::section})}">
<head><title>账号权限 · LiteData</title></head><body><section>
<h1 class="page-title">账号权限</h1><p class="page-subtitle">管理员维护账号，开发者配置管道和服务，只读用户查看运行状态。</p>
<div th:replace="~{fragments/messages :: messages}"></div>
<div class="card mb-3"><div class="card-body"><table class="table"><thead><tr><th>账号</th><th>角色</th><th>状态</th></tr></thead>
<tbody><tr th:each="account : ${users}"><td th:text="${account.username}"></td><td th:text="${account.role}"></td><td th:text="${account.enabled} ? '启用' : '停用'"></td></tr></tbody></table></div></div>
<div class="card"><div class="card-body"><h2 class="h5">创建账号</h2>
<form th:action="@{/users}" method="post" class="row g-3">
<input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
<div class="col-md-4"><label class="form-label" for="username">用户名</label><input class="form-control" id="username" name="username" required minlength="3" maxlength="60" autocomplete="off"></div>
<div class="col-md-4"><label class="form-label" for="password">初始密码</label><input class="form-control" type="password" id="password" name="password" required minlength="12" maxlength="72" autocomplete="new-password"></div>
<div class="col-md-4"><label class="form-label" for="role">角色</label><select class="form-select" id="role" name="role"><option value="VIEWER">只读用户</option><option value="DEVELOPER">开发者</option><option value="ADMIN">管理员</option></select></div>
<div class="col-12"><button class="btn btn-primary" type="submit">创建账号</button></div></form></div></div>
</section></body></html>
