<!doctype html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/layout :: layout(~{::title}, ~{::section})}">
<head><title>同步管道 · 数据中台</title></head>
<body><section>
  <div class="mb-7"><div class="page-kicker">数据开发 / <a th:href="@{/pipelines}">同步管道</a></div><h1 class="page-title" th:text="${resourceId == null ? '创建同步管道' : '编辑同步管道'}">创建同步管道</h1><p class="page-subtitle mb-0">以 Watermark 列进行每小时增量同步，写入 Doris 后执行 SQL 加工。</p></div>
  <div th:replace="~{fragments/messages :: messages}"></div>
  <form th:if="${canEdit}" th:object="${draft}" th:action="${formAction}" method="post">
    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
    <article class="platform-card card mb-5"><div class="card-header">管道定义</div><div class="card-body"><p th:if="${resourceId != null}" class="alert theme-info">同步边界与调度配置在创建后固定；编辑时仅可修改名称和同步后加工 SQL。</p><div class="row g-5">
      <div class="md:col-6"><label class="form-label" for="name">管道名称</label><input class="form-control" th:field="*{name}" required maxlength="100"></div>
      <div class="md:col-6"><label class="form-label" for="sourceId">来源数据源</label><select class="form-control" th:field="*{sourceId}" th:disabled="${resourceId != null}" required><option value="">请选择</option><option th:each="source : ${sources}" th:value="${source.id}" th:text="${source.name}">业务主库</option></select><input th:if="${resourceId != null}" type="hidden" th:field="*{sourceId}"></div>
      <div class="md:col-6"><label class="form-label" for="sourceTable">来源表</label><input class="form-control" th:field="*{sourceTable}" th:disabled="${resourceId != null}" required placeholder="orders"><input th:if="${resourceId != null}" type="hidden" th:field="*{sourceTable}"></div>
      <div class="md:col-6"><label class="form-label" for="targetTable">Doris 目标表</label><input class="form-control" th:field="*{targetTable}" th:disabled="${resourceId != null}" required placeholder="ods_orders"><input th:if="${resourceId != null}" type="hidden" th:field="*{targetTable}"></div>
      <div class="md:col-6"><label class="form-label" for="watermarkColumn">Watermark 列</label><input class="form-control" th:field="*{watermarkColumn}" th:disabled="${resourceId != null}" required placeholder="updated_at"><input th:if="${resourceId != null}" type="hidden" th:field="*{watermarkColumn}"></div>
      <div class="md:col-6"><label class="form-label" for="cronExpression">调度表达式</label><input class="form-control" th:field="*{cronExpression}" th:disabled="${resourceId != null}" required><input th:if="${resourceId != null}" type="hidden" th:field="*{cronExpression}"><div class="form-text">默认每小时整点执行。</div></div>
      <div class="col-12"><label class="form-label" for="transformSql">同步后加工 SQL（可选）</label><textarea class="form-control code-preview" th:field="*{transformSql}" data-sql-editor spellcheck="false" rows="5" maxlength="20000" placeholder="INSERT INTO dwd_orders SELECT ... FROM ods_orders"></textarea><div class="form-text">仅同步到 ODS 时留空；多层加工请在“SQL 加工任务”中配置。</div></div>
    </div></div></article>
    <div class="d-flex gap-3"><button class="btn-solid theme-primary" type="submit" th:text="${resourceId == null ? '创建管道' : '保存修改'}">创建管道</button><a class="btn-outline theme-secondary" th:href="@{/pipelines}">取消</a></div>
  </form>
  <p th:unless="${canEdit}" class="alert theme-info">当前账号仅可查看同步管道。</p>
  <script th:src="@{/js/sql-editor.js}" defer></script>
</section></body>
</html>
