<!doctype html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/layout :: layout(~{::title}, ~{::section})}">
<head><title>数据加工 · LiteData</title></head><body><section class="scheduling-form">
  <div class="mb-7"><h1 class="page-title" th:text="${taskId == null ? '新增数据加工' : '编辑数据加工'}"></h1><p class="page-subtitle mb-0">一个任务写入一个模型；依赖和执行周期请在工作流画布中配置。</p></div>
  <div th:replace="~{fragments/messages :: messages}"></div>
  <form th:if="${canEdit}" th:object="${draft}" th:action="${taskId == null ? '/transforms' : '/transforms/' + taskId}" method="post">
    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><input type="hidden" th:field="*{version}"><input th:if="${workflowId != null}" type="hidden" name="workflowId" th:value="${workflowId}">
    <input type="hidden" name="returnTo" th:value="${returnTo}"><input th:if="${returnPageNum != null}" type="hidden" name="pageNum" th:value="${returnPageNum}"><input th:if="${returnPageSize != null}" type="hidden" name="pageSize" th:value="${returnPageSize}">
    <article class="platform-card card mb-5"><div class="card-header">1. 基础信息</div><div class="card-body"><div class="row g-5">
      <div class="md:col-6"><label class="form-label" for="name">任务名称</label><input class="form-control" th:field="*{name}" required maxlength="100"></div>
      <div class="md:col-6"><label class="form-label" for="modelId">目标模型</label><select class="form-control" th:field="*{modelId}" required><option value="">请选择 DIM / DWD / DWS / ADS 模型</option><option th:each="model : ${models}" th:value="${model.id}" th:text="${model.layer + ' / ' + model.tableName + ' · ' + model.name}"></option></select><div class="form-text">每个目标模型对应一个加工任务；运行前须完成建表和结构核对。</div></div>
    </div></div></article>
    <article class="platform-card card mb-5"><div class="card-header">2. 加工 SQL</div><div class="card-body"><label class="form-label" for="sqlText">Doris 加工 SQL</label><textarea class="form-control code-preview" th:field="*{sqlText}" data-sql-editor spellcheck="false" rows="8" required maxlength="20000" aria-describedby="sqlText-help" placeholder="INSERT INTO dwd_orders (id, customer_name, amount, updated_at)&#10;SELECT id, customer_name, amount, updated_at FROM ods_orders WHERE amount &gt;= 0"></textarea><div class="form-text" id="sqlText-help">单条 INSERT INTO ... SELECT，仅访问 warehouse；目标须与模型一致。UNIQUE KEY 会覆盖相同主键，失效汇总行需另行处理。</div></div></article>
    <div class="d-flex gap-3"><button class="btn-solid theme-primary" type="submit">保存任务</button><a class="btn-outline theme-secondary" th:href="${backPath}">取消</a></div>
  </form><p th:unless="${canEdit}" class="alert theme-info">当前账号仅可查看任务。</p>
  <script th:src="@{/js/sql-editor.js}" defer></script>
</section></body></html>
