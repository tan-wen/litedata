<!doctype html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/layout :: layout(~{::title}, ~{::section})}">
<head><title>元数据详情 · LiteData</title></head><body><section>
  <div class="d-flex flex-wrap justify-content-between align-items-center mb-7 gap-5"><div><h1 class="page-title" th:text="${table.catalogName + '.' + table.tableName}"></h1><p class="page-subtitle mb-0" th:text="${table.sourceName + ' · 结构版本 v' + table.version}"></p></div><div class="d-flex gap-3"><a class="btn-solid theme-primary" th:href="@{/metadata/{id}/lineage(id=${table.id})}">查看血缘</a><a class="btn-outline theme-secondary" th:href="@{/metadata}">返回目录</a></div></div>
  <div th:replace="~{fragments/messages :: messages}"></div>
  <div class="alert theme-warning" th:unless="${table.present}">最近一次完整采集未发现此表，以下保留上次发现时的结构。请核对表是否删除或采集账号权限是否变化。</div>
  <article class="platform-card card mb-5"><div class="card-header">表信息</div><div class="card-body"><p th:text="${#strings.isEmpty(table.comment) ? '暂无表注释' : table.comment}"></p><p class="fg-2" th:text="${'上次发现时间（北京时间）：' + #temporals.format(table.collectedAt,'yyyy-MM-dd HH:mm:ss')}"></p><a th:if="${table.modelId != null}" class="btn-link theme-primary" th:href="@{/models/{id}(id=${table.modelId})}" th:text="${'关联模型：' + table.layer + ' / ' + table.modelName}"></a></div></article>
  <article class="platform-card card"><div class="card-header">字段结构</div><div class="card-body"><div class="table-responsive"><table class="table mb-0"><thead><tr><th>序号</th><th>字段名</th><th>类型</th><th>允许空值</th><th>主键标记</th><th>注释</th></tr></thead><tbody><tr th:each="column : ${columns}"><td th:text="${column.position}"></td><td th:text="${column.name}"></td><td th:text="${column.dataType}"></td><td th:text="${column.nullable ? '是' : '否'}"></td><td th:text="${column.keyColumn ? '是' : '—'}"></td><td class="modeling-diff" th:text="${column.comment}"></td></tr><tr th:if="${#lists.isEmpty(columns)}"><td colspan="6" class="fg-2 text-center">没有采集到字段</td></tr></tbody></table></div></div></article>
</section></body></html>
