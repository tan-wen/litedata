<!doctype html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/layout :: layout(~{::title}, ~{::section})}">
<head><title>工作流 · LiteData</title></head><body><section>
  <div class="mb-7"><h1 class="page-title" th:text="${workflowId == null ? '新建工作流' : '编辑工作流信息'}"></h1><p class="page-subtitle mb-0">末端任务确定后不可更换；依赖、周期和运行操作在画布页面维护。</p></div><div th:replace="~{fragments/messages :: messages}"></div>
  <form th:if="${canEdit}" th:object="${draft}" th:action="${workflowId == null ? '/workflows' : '/workflows/' + workflowId + '/metadata'}" method="post"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><input type="hidden" th:field="*{version}">
    <article class="platform-card card mb-5"><div class="card-header">基本信息</div><div class="card-body"><div class="row g-5"><div class="md:col-6"><label class="form-label" for="name">工作流名称</label><input class="form-control" th:field="*{name}" required maxlength="100"></div><div class="md:col-6"><label class="form-label" for="rootTaskId">末端任务</label><select th:if="${workflowId == null}" class="form-control" th:field="*{rootTaskId}" required><option value="">请选择末端 SQL 任务</option><option th:each="root : ${roots}" th:value="${root.id}" th:text="${root.name + ' → ' + root.targetTable}"></option></select><input th:unless="${workflowId == null}" class="form-control" readonly th:value="${draft.rootName + ' (#' + draft.rootTaskId + ')'}"><input th:unless="${workflowId == null}" type="hidden" th:field="*{rootTaskId}"><div class="form-text">仅 SQL 任务可作为根；同步管道只能作为上游。</div></div><div class="col-12"><label class="form-label" for="description">说明</label><textarea class="form-control" th:field="*{description}" rows="4" maxlength="500" placeholder="说明此工作流的数据范围或运行目的"></textarea></div></div></div></article>
    <div class="d-flex gap-3"><button class="btn-solid theme-primary" type="submit" th:text="${workflowId == null ? '创建并编辑画布' : '保存信息'}"></button><a class="btn-outline theme-secondary" th:href="${workflowId == null ? '/workflows' : '/workflows/' + workflowId}">取消</a></div>
  </form><p th:unless="${canEdit}" class="alert theme-info">当前账号仅可查看工作流。</p>
</section></body></html>
