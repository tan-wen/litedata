<!doctype html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/layout :: layout(~{::title}, ~{::section})}">
<head><title>质量运行详情 · LiteData</title></head><body><section>
  <div class="d-flex flex-wrap justify-content-between align-items-center mb-7 gap-5"><div><h1 class="page-title">质量运行详情</h1><p class="page-subtitle mb-0"><span th:text="${run.id}"></span> · <span th:text="${'任务配置 v' + run.taskVersion}"></span></p></div><a class="btn-outline theme-secondary" th:href="@{/quality/{id}(id=${task.id})}">返回任务</a></div>
  <div th:replace="~{fragments/messages :: messages}"></div>
  <article class="platform-card card mb-5"><div class="card-header">执行概览</div><div class="card-body"><div class="row g-5"><div class="md:col-3"><div class="fg-2 small">状态</div><span class="badge" th:classappend="${run.status == 'PASSED' ? 'theme-success' : run.status == 'WARNING' ? 'theme-warning' : run.status == 'RUNNING' ? 'theme-info' : 'theme-danger'}" th:text="${run.statusLabel}"></span></div><div class="md:col-3"><div class="fg-2 small">发起人</div><div th:text="${run.actor ?: '系统'}"></div></div><div class="md:col-3"><div class="fg-2 small">开始时间</div><div th:text="${#temporals.format(run.startedAt, 'yyyy-MM-dd HH:mm:ss')}"></div></div><div class="md:col-3"><div class="fg-2 small">结束时间</div><div th:text="${run.finishedAt == null ? '运行中' : #temporals.format(run.finishedAt, 'yyyy-MM-dd HH:mm:ss')}"></div></div><div class="col-12" th:if="${!#strings.isEmpty(run.message)}"><div class="fg-2 small">执行消息</div><div class="modeling-diff" th:text="${run.message}"></div></div></div></div></article>
  <article class="platform-card card mb-5"><div class="card-header">规则结果</div><div class="card-body p-0"><div class="table-responsive"><table class="table mb-0"><thead><tr><th>规则</th><th>类型</th><th>级别</th><th>检测行数</th><th>异常数 / 比例</th><th>状态</th><th>说明</th></tr></thead><tbody><tr th:each="result : ${results}"><td th:text="${result.name}"></td><td th:text="${result.type.label}"></td><td><span class="badge" th:classappend="${result.severity == 'CRITICAL' ? 'theme-danger' : 'theme-warning'}" th:text="${result.severity}"></span></td><td th:text="${result.totalCount}"></td><td th:text="${result.anomalyCount + ' / ' + result.anomalyPercent + '%'}"></td><td><span class="badge" th:classappend="${result.status == 'PASSED' ? 'theme-success' : result.status == 'WARNING' ? 'theme-warning' : result.status == 'ERROR' ? 'theme-danger' : 'theme-danger'}" th:text="${result.statusLabel}"></span></td><td class="modeling-diff" th:text="${result.message}"></td></tr><tr th:if="${#lists.isEmpty(results)}"><td colspan="7" class="text-center fg-2 py-7">运行尚未产生规则结果。</td></tr></tbody></table></div></div><div class="card-footer bg-body small fg-2">为保护业务数据，此页面不展示异常原始行。</div></article>
  <details class="platform-card card"><summary class="card-header">查看本次配置快照</summary><div class="card-body"><pre class="code-preview mb-0" th:text="${run.configSnapshot}"></pre></div></details>
  <div class="d-none" aria-hidden="true" data-quality-metrics><span th:each="result,stat : ${results}" th:attr="data-quality-metric-index=${stat.index}" th:text="${result.metricValue}"></span></div><script th:src="@{/js/quality.js}" defer></script>
</section></body></html>
