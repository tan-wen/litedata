<!doctype html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout(~{::title}, ~{::section})}">
<head><title>数据建模 · LiteData</title></head>
<body>
<section>
  <header class="page-topbar">
    <div th:replace="~{fragments/workspace :: context}"></div>
    <div class="page-heading d-flex justify-content-between align-items-center gap-5">
    <div><h1 class="page-title">数据建模</h1>
      <p class="page-subtitle mb-0">设计 DIM、DWD、DWS、ADS 业务模型；ODS 可由数据同步自动生成并登记，统一在此管理结构。</p>
    </div>
    <div th:if="${canEdit}" class="d-flex gap-3"><a class="btn-outline theme-primary"
                                                    th:href="@{/models/new(layer='DIM')}">新增公共维度</a><a
      class="btn-solid theme-primary" th:href="@{/models/new(layer='DWD')}">新增业务模型</a></div>

    <a th:replace="~{fragments/workspace :: back}"></a>
  </div>
  </header>
  <div th:replace="~{fragments/messages :: messages}"></div>
  <article class="workspace-section">
    <div class="card-header">模型目录</div>
    <div class="card-body">
      <form class="row g-3 mb-5" th:action="@{/models}" method="get">
        <div class="sm:col-6"><input class="form-control" name="keyword" th:value="${keyword}" maxlength="100"
                                     aria-label="搜索模型" placeholder="表名、中文名称或主题域"></div>
        <div class="sm:col-3"><select class="form-control" name="layer" aria-label="分层筛选">
          <option value="">全部分层</option>
          <option th:each="item : ${layers}" th:value="${item}" th:text="${item}"
                  th:selected="${layer == item}"></option>
        </select></div>
        <div class="sm:col-3">
          <button class="btn-outline theme-primary" type="submit">查询</button>
          <a class="btn-link theme-primary" th:href="@{/models}">重置</a></div>
      </form>
      <div class="table-responsive">
        <table class="table table-hover mb-0">
          <thead>
          <tr>
            <th>表名</th>
            <th>中文名称</th>
            <th>主题域</th>
            <th>分层</th>
            <th>数据模型</th>
            <th>模型版本</th>
            <th>是否建表</th>
            <th>物理结构</th>
            <th>操作</th>
          </tr>
          </thead>
          <tbody>
          <tr th:each="item : ${models}" th:with="creationStatus=${creationStatuses[item.id]}">
            <td><a th:href="@{/models/{id}(id=${item.id})}" th:text="${item.tableName}"></a></td>
            <td th:text="${item.name}"></td>
            <td th:text="${subjectAreaLabels[item.subjectArea] ?: item.subjectArea}"></td>
            <td><span class="badge theme-info" th:text="${item.layer}"></span></td>
            <td><span class="badge theme-secondary" th:text="${item.modelType + ' KEY'}"></span></td>
            <td th:text="${'v' + item.version}"></td>
            <td><span class="badge"
                      th:classappend="${creationStatus.created ? 'theme-success' : (creationStatus.notCreated ? 'theme-secondary' : 'theme-warning')}"
                      th:text="${creationStatus.label}"></span></td>
            <td><span class="badge"
                      th:classappend="${item.physicalVersion != null and item.physicalVersion == item.version} ? 'theme-success' : 'theme-warning'"
                      th:text="${creationStatus.created and item.physicalVersion == null ? '待核对' : item.physicalStatus}"></span>
            </td>
            <td>
              <div class="d-flex align-items-center gap-2 text-nowrap"><a th:if="${canEdit}" class="btn-link theme-primary btn-sm"
                           th:href="@{/models/{id}/edit(id=${item.id})}">编辑</a>
                <form th:if="${canEdit and creationStatus.notCreated}"
                      th:action="@{/models/{id}/archive(id=${item.id})}" method="post" class="d-inline"><input
                  type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><input type="hidden"
                                                                                                  name="version"
                                                                                                  th:value="${item.version}">
                  <button class="btn-link theme-danger btn-sm" type="submit"
                          th:attr="aria-label=${'删除模型 ' + item.tableName}">删除
                  </button>
                </form>
              </div>
            </td>
          </tr>
          <tr th:if="${#lists.isEmpty(models)}">
            <td colspan="9" class="text-center fg-2 py-10">暂无符合条件的模型。新增模型后可生成建表语句。</td>
          </tr>
          </tbody>
        </table>
      </div>
    </div>
  </article>
  <div th:replace="~{fragments/pagination :: pagination}"></div>
</section>
</body>
</html>
