<!doctype html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/layout :: layout(~{::title}, ~{::section})}">
<head><title>创建 API Key · LiteData</title></head><body><section>
  <div class="mb-7"><div class="page-kicker">系统设置 / <a th:href="@{/settings/api-keys}">我的 API Key</a></div><h1 class="page-title">创建 API Key</h1><p class="page-subtitle mb-0">仅授予 Agent 此次连接所需的工具和资源范围。</p></div>
  <div th:replace="~{fragments/messages :: messages}"></div>
  <form th:object="${draft}" th:action="@{/settings/api-keys}" method="post"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
    <article class="platform-card card mb-5"><div class="card-header">Key 配置</div><div class="card-body"><div class="row g-5">
      <div class="md:col-6"><label class="form-label" for="name">名称</label><input class="form-control" th:field="*{name}" required maxlength="100" placeholder="本地分析 Agent"><div class="form-text">用于识别用途，不能用来恢复密钥。</div></div>
      <div class="md:col-6"><label class="form-label" for="validDays">有效期（天）</label><input class="form-control" th:field="*{validDays}" required type="number" min="1" max="365"><div class="form-text">最短 1 天，最长 365 天。</div></div>
      <div class="col-12"><label class="form-label">工具权限</label><div class="d-flex flex-wrap gap-5">
        <label class="d-inline-flex align-items-center gap-3 mb-0 text-nowrap"><input class="check m-0" type="checkbox" name="scopes" value="services:read" th:checked="${#arrays.contains(draft.scopes, 'services:read')}"><span>浏览数据服务</span></label>
        <label class="d-inline-flex align-items-center gap-3 mb-0 text-nowrap"><input class="check m-0" type="checkbox" name="scopes" value="services:query" th:checked="${#arrays.contains(draft.scopes, 'services:query')}"><span>查询数据服务</span></label>
        <label class="d-inline-flex align-items-center gap-3 mb-0 text-nowrap" th:if="${allowedScopes.contains('pipelines:run')}"><input class="check m-0" type="checkbox" name="scopes" value="pipelines:run" th:checked="${#arrays.contains(draft.scopes, 'pipelines:run')}"><span>执行同步管道</span></label>
      </div></div>
      <div class="md:col-6"><label class="form-label" for="serviceSlugs">允许的数据服务</label><input class="form-control" th:field="*{serviceSlugs}" maxlength="8000" placeholder="customer-summary, order-daily"><div class="form-text">逗号分隔，最多 100 个。<a th:href="@{/services}">查看数据服务</a>。</div></div>
      <div class="md:col-6"><label class="form-label" for="pipelineIds">允许的同步管道</label><input class="form-control" th:field="*{pipelineIds}" maxlength="8000" placeholder="12,34"><div class="form-text">逗号分隔，最多 100 个；仅在选择执行权限时使用。<a th:href="@{/pipelines}">查看同步管道</a>。</div></div>
    </div></div></article>
    <div class="d-flex gap-3"><button class="btn-solid theme-primary" type="submit">创建并显示 Key</button><a class="btn-outline theme-secondary" th:href="@{/settings/api-keys}">取消</a></div>
  </form>
</section></body></html>
