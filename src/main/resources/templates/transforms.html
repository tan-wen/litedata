<!doctype html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout(~{::title}, ~{::section})}">
<head><title>SQL 任务 · LiteData</title></head>
<body>
<section>
  <link rel="stylesheet" th:href="@{/css/workflow-canvas.css}">
  <div class="d-flex justify-content-between align-items-center mb-7 gap-5">
    <div><h1 class="page-title">SQL 任务</h1>
      <p class="page-subtitle mb-0">通过 Doris SQL 连接 ODS、DIM、DWD、DWS、ADS；依赖和运行计划统一在数据加工中维护。</p>
    </div>
    <div class="d-flex gap-3"><a class="btn-outline theme-secondary" th:href="@{/workflows}">数据加工</a><a
      th:if="${canEdit}" class="btn-solid theme-primary" th:href="@{/transforms/new}">新增 SQL 任务</a></div>
  </div>
  <div th:replace="~{fragments/messages :: messages}"></div>
  <div class="alert theme-info">SQL 任务只维护基础信息和 SQL，且仅属于一个加工流程。请在所属数据加工画布新增和编辑
    SQL、组织依赖、设置周期并集中运行。
  </div>
  <article class="platform-card card">
    <div class="card-header">SQL 任务目录</div>
    <div class="card-body p-0">
      <div class="table-responsive">
        <table class="table table-hover mb-0">
          <thead>
          <tr>
            <th>任务名称</th>
            <th>目标模型</th>
            <th>分层</th>
            <th>版本</th>
            <th>操作</th>
          </tr>
          </thead>
          <tbody>
          <tr th:each="task : ${tasks}">
            <td><a th:href="@{/transforms/{id}(id=${task.id})}" th:text="${task.name}"></a></td>
            <td th:text="${task.targetTable}"></td>
            <td th:text="${task.layer}"></td>
            <td th:text="${'v' + task.version}"></td>
            <td>
              <div class="workflow-actions"><a class="btn-outline theme-primary btn-sm"
                                               th:href="@{/transforms/{id}(id=${task.id})}">查看 SQL</a><a
                th:if="${canEdit}" class="btn-link theme-primary btn-sm"
                th:href="@{/transforms/{id}/edit(id=${task.id},returnTo='list',pageNum=${pageNum},pageSize=${pageSize})}">编辑</a>
              </div>
            </td>
          </tr>
          <tr th:if="${#lists.isEmpty(tasks)}">
            <td colspan="5" class="text-center fg-2 py-10">暂无 SQL 任务。请先建立 DIM / DWD / DWS / ADS 模型，再配置
              SQL。
            </td>
          </tr>
          </tbody>
        </table>
      </div>
    </div>
  </article>
  <div th:replace="~{fragments/pagination :: pagination}"></div>
</section>
</body>
</html>
