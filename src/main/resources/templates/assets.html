<!doctype html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout(~{::title}, ~{::section})}">
<head><title>资产目录 · LiteData</title></head>
<body>
<section>
  <header class="page-topbar">
    <div th:replace="~{fragments/workspace :: context}"></div>
    <div class="page-heading d-flex flex-wrap justify-content-between align-items-start gap-5">
    <div><h1 class="page-title">资产目录</h1>
      <p class="page-subtitle mb-0">统一发现物理表、逻辑模型、指标和数据服务，查看口径、归属、质量与使用入口。</p></div>
    <div class="d-flex gap-3"><span class="badge theme-info" th:text="${'共 ' + stats.total() + ' 项资产'}"></span>
    </div>

    <a th:replace="~{fragments/workspace :: back}"></a>
  </div>
  </header>
  <div th:replace="~{fragments/messages :: messages}"></div>
  <div class="asset-directory-layout">
    <aside class="workspace-section asset-directory-sidebar">
      <div class="card-header">资产分类</div>
      <nav class="asset-tree" aria-label="资产分类">
        <ul class="asset-tree-root">
          <li>
            <details class="asset-tree-branch" open>
              <summary class="asset-tree-row">
                <span class="asset-tree-toggle" aria-hidden="true"><svg class="nav-icon" viewBox="0 0 24 24"><path d="m9 5 7 7-7 7"/></svg></span>
                <a class="asset-tree-link" th:href="@{${treeRootPath}}"
                   th:classappend="${#strings.isEmpty(assetType)} ? 'active'"
                   th:attr="aria-current=${#strings.isEmpty(assetType) ? 'true' : null}">资产目录</a>
              </summary>
              <ul class="asset-tree-children">
                <li th:each="category : ${categories}">
                  <details class="asset-tree-branch" th:open="${assetType == category.type}">
                    <summary class="asset-tree-row">
                      <span class="asset-tree-toggle" aria-hidden="true"><svg class="nav-icon" viewBox="0 0 24 24"><path d="m9 5 7 7-7 7"/></svg></span>
                      <a class="asset-tree-link" th:href="@{${category.path}}"
                         th:classappend="${assetType == category.type and #strings.isEmpty(assetCategory)} ? 'active'"
                         th:attr="aria-current=${assetType == category.type and #strings.isEmpty(assetCategory) ? 'true' : null}">
                        <span class="asset-tree-label" th:text="${category.label}"></span>
                        <span class="asset-tree-count" th:text="${'（' + category.count + '）'}"></span>
                      </a>
                    </summary>
                    <ul class="asset-tree-children">
                      <li th:each="child : ${category.children}">
                        <a class="asset-tree-link" th:href="@{${child.path}}"
                           th:classappend="${assetType == category.type and assetCategory == child.key} ? 'active'"
                           th:attr="aria-current=${assetType == category.type and assetCategory == child.key ? 'true' : null}">
                          <span class="asset-tree-label" th:text="${child.label}"></span>
                          <span class="asset-tree-count" th:text="${'（' + child.count + '）'}"></span>
                        </a>
                      </li>
                      <li th:if="${#lists.isEmpty(category.children)}" class="small fg-2 px-2 py-3">暂无分类</li>
                    </ul>
                  </details>
                </li>
              </ul>
            </details>
          </li>
        </ul>
      </nav>
    </aside>
    <div class="asset-directory-content">
      <article class="workspace-section">
        <div class="card-header">检索资产</div>
        <div class="card-body">
          <form class="row g-3" th:action="@{/assets}" method="get">
            <input type="hidden" name="assetType" th:value="${assetType}">
            <input type="hidden" name="assetCategory" th:value="${assetCategory}">
            <input type="hidden" name="pageSize" th:value="${pageSize}">
            <div class="md:col-8"><label class="form-label" for="asset-keyword">关键词</label><input class="form-control"
                                                                                                     id="asset-keyword"
                                                                                                     name="keyword"
                                                                                                     maxlength="100"
                                                                                                     th:value="${keyword}"
                                                                                                     placeholder="名称、编码、说明、表名或标签">
            </div>
            <div class="md:col-4"><label class="form-label" for="asset-status">状态</label><select class="form-control"
                                                                                                   id="asset-status"
                                                                                                   name="assetStatus">
              <option value="">全部状态</option>
              <option th:each="item : ${assetStatuses}" th:value="${item.key}" th:text="${item.value}"
                      th:selected="${assetStatus == item.key}"></option>
            </select></div>
            <div class="md:col-4"><label class="form-label" for="asset-area">主题域</label>
              <select th:replace="~{fragments/subject-area :: select('asset-area','subjectArea',${subjectArea},false,'全部主题域',true)}"></select>
            </div>
            <div class="md:col-4"><label class="form-label" for="asset-owner">负责人</label><input class="form-control"
                                                                                                   id="asset-owner"
                                                                                                   name="owner"
                                                                                                   maxlength="100"
                                                                                                   th:value="${owner}"
                                                                                                   placeholder="负责人">
            </div>
            <div class="md:col-4"><label class="form-label" for="asset-tag">标签</label><input class="form-control"
                                                                                               id="asset-tag" name="tag"
                                                                                               maxlength="50"
                                                                                               th:value="${tag}"
                                                                                               placeholder="例如：核心">
            </div>
            <div class="col-12">
              <button class="btn-solid theme-primary" type="submit">查询</button>
              <a class="btn-link theme-primary" th:href="@{${resetPath}}">重置</a></div>
          </form>
        </div>
      </article>
      <article class="workspace-section mt-5">
        <div class="card-header">资产列表</div>
        <div class="card-body p-0">
          <div class="table-responsive">
            <table class="table table-hover mb-0">
              <thead>
              <tr>
                <th>名称 / 编码</th>
                <th>类型</th>
                <th>主题域 / 分层</th>
                <th>负责人</th>
                <th>来源</th>
                <th>状态</th>
                <th th:if="${canEdit}">操作</th>
              </tr>
              </thead>
              <tbody>
              <tr th:each="asset : ${assets}">
                <td><a th:href="@{${asset.path}}" th:text="${asset.name}"></a>
                  <div class="small fg-2" th:text="${asset.code ?: '—'}"></div>
                  <div class="small fg-2" th:if="${!#strings.isEmpty(asset.tags)}" th:text="${asset.tags}"></div>
                </td>
                <td><span class="badge theme-info" th:text="${asset.type.label}"></span></td>
                <td><span th:text="${subjectAreaLabels[asset.subjectArea] ?: (asset.subjectArea ?: '—')}"></span>
                  <div class="small fg-2" th:text="${asset.layer ?: '—'}"></div>
                </td>
                <td th:text="${asset.owner ?: '—'}"></td>
                <td th:text="${asset.sourceName ?: '—'}"></td>
                <td><span class="badge"
                          th:classappend="${asset.status == 'ACTIVE' or asset.status == 'PUBLISHED'} ? 'theme-success' : (${asset.status == 'MISSING'} ? 'theme-warning' : 'theme-secondary')"
                          th:text="${asset.statusLabel}"></span></td>
                <td th:if="${canEdit}"><a class="btn-outline theme-primary btn-sm text-nowrap"
                                         th:href="@{${editPaths[asset.path]}}">编辑目录信息</a></td>
              </tr>
              <tr th:if="${#lists.isEmpty(assets)}">
                <td th:colspan="${canEdit ? 7 : 6}" class="text-center fg-2 py-10">暂无符合条件的资产。可先采集元数据或维护模型、指标和数据服务。
                </td>
              </tr>
              </tbody>
            </table>
          </div>
        </div>
      </article>
      <div th:replace="~{fragments/pagination :: pagination}"></div>
    </div>
  </div>
</section>
</body>
</html>
