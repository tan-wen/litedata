<!doctype html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/layout :: layout(~{::title}, ~{::section})}">
<head><title>资产目录 · LiteData</title></head><body><section>
  <div class="d-flex flex-wrap justify-content-between align-items-start mb-7 gap-5"><div><h1 class="page-title">资产目录</h1><p class="page-subtitle mb-0">统一发现数据表、逻辑模型、指标和数据服务，查看口径、归属、质量与使用入口。</p></div><div class="d-flex gap-3"><span class="badge theme-info" th:text="${'共 ' + stats.total() + ' 项资产'}"></span></div></div>
  <div th:replace="~{fragments/messages :: messages}"></div>
  <div class="row g-4 mb-5"><div class="sm:col-6 xl:col-3"><article class="platform-card card h-100"><div class="card-body"><div class="fg-2 small">数据表</div><div class="fs-3 fw-semibold" th:text="${stats.tables()}"></div></div></article></div><div class="sm:col-6 xl:col-3"><article class="platform-card card h-100"><div class="card-body"><div class="fg-2 small">逻辑模型</div><div class="fs-3 fw-semibold" th:text="${stats.models()}"></div></div></article></div><div class="sm:col-6 xl:col-3"><article class="platform-card card h-100"><div class="card-body"><div class="fg-2 small">指标</div><div class="fs-3 fw-semibold" th:text="${stats.metrics()}"></div></div></article></div><div class="sm:col-6 xl:col-3"><article class="platform-card card h-100"><div class="card-body"><div class="fg-2 small">数据服务</div><div class="fs-3 fw-semibold" th:text="${stats.services()}"></div></div></article></div></div>
  <article class="platform-card card"><div class="card-header">检索资产</div><div class="card-body"><form class="row g-3" th:action="@{/assets}" method="get"><div class="md:col-6"><label class="form-label" for="asset-keyword">关键词</label><input class="form-control" id="asset-keyword" name="keyword" maxlength="100" th:value="${keyword}" placeholder="名称、编码、说明、表名或标签"></div><div class="md:col-3"><label class="form-label" for="asset-type">类型</label><select class="form-control" id="asset-type" name="assetType"><option value="">全部类型</option><option th:each="item : ${assetTypes}" th:value="${item.name()}" th:text="${item.label}" th:selected="${assetType == item.name()}"></option></select></div><div class="md:col-3"><label class="form-label" for="asset-status">状态</label><select class="form-control" id="asset-status" name="assetStatus"><option value="">全部状态</option><option th:each="item : ${assetStatuses}" th:value="${item.key}" th:text="${item.value}" th:selected="${assetStatus == item.key}"></option></select></div><div class="md:col-4"><label class="form-label" for="asset-area">主题域</label><input class="form-control" id="asset-area" name="subjectArea" maxlength="100" th:value="${subjectArea}" placeholder="例如：交易"></div><div class="md:col-4"><label class="form-label" for="asset-owner">负责人</label><input class="form-control" id="asset-owner" name="owner" maxlength="100" th:value="${owner}" placeholder="负责人"></div><div class="md:col-4"><label class="form-label" for="asset-tag">标签</label><input class="form-control" id="asset-tag" name="tag" maxlength="50" th:value="${tag}" placeholder="例如：核心"></div><div class="col-12"><button class="btn-solid theme-primary" type="submit">查询</button><a class="btn-link theme-primary" th:href="@{/assets}">重置</a></div></form></div></article>
  <article class="platform-card card mt-5"><div class="card-header">资产列表</div><div class="card-body p-0"><div class="table-responsive"><table class="table table-hover mb-0"><thead><tr><th>名称 / 编码</th><th>类型</th><th>主题域 / 分层</th><th>负责人</th><th>来源</th><th>状态</th><th>操作</th></tr></thead><tbody><tr th:each="asset : ${assets}"><td><a th:href="@{${asset.path}}" th:text="${asset.name}"></a><div class="small fg-2" th:text="${asset.code ?: '—'}"></div><div class="small fg-2" th:if="${!#strings.isEmpty(asset.tags)}" th:text="${asset.tags}"></div></td><td><span class="badge theme-info" th:text="${asset.type.label}"></span></td><td><span th:text="${asset.subjectArea ?: '—'}"></span><div class="small fg-2" th:text="${asset.layer ?: '—'}"></div></td><td th:text="${asset.owner ?: '—'}"></td><td th:text="${asset.sourceName ?: '—'}"></td><td><span class="badge" th:classappend="${asset.status == 'ACTIVE' or asset.status == 'PUBLISHED'} ? 'theme-success' : (${asset.status == 'MISSING'} ? 'theme-warning' : 'theme-secondary')" th:text="${asset.statusLabel}"></span></td><td><a class="btn-outline theme-primary btn-sm" th:href="@{${asset.path}}">查看</a></td></tr><tr th:if="${#lists.isEmpty(assets)}"><td colspan="7" class="text-center fg-2 py-10">暂无符合条件的资产。可先采集元数据或维护模型、指标和数据服务。</td></tr></tbody></table></div></div></article>
  <div th:replace="~{fragments/pagination :: pagination}"></div>
</section></body></html>
