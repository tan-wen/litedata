<!doctype html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/layout :: layout(~{::title}, ~{::section})}">
<head><title>运行实例 · LiteData</title></head><body><section>
  <link rel="stylesheet" th:href="@{/css/scheduler-console.css}">
  <div class="d-flex flex-wrap justify-content-between align-items-start gap-5 mb-7">
    <div><nav th:replace="~{fragments/scheduler-breadcrumb :: breadcrumb(${resource}, ${null})}"></nav><h1 class="page-title">运行实例</h1><p class="page-subtitle mb-0">查看每次工作流执行的实际结果，进入实例定位节点并查看日志。</p></div>
    <div class="d-flex gap-3"><button class="btn-outline theme-primary" type="button" onclick="location.reload()">刷新实例</button><a th:if="${resource.type == 'pipeline'}" class="btn-outline theme-secondary" th:href="@{/pipelines/{id}/runs(id=${resource.id})}">同步记录</a><a class="btn-outline theme-secondary" th:href="${resource.backPath}">返回任务</a></div>
  </div>
  <div th:if="${engineError}" class="alert theme-warning" role="alert"><span th:text="${engineError}"></span> <a th:href="${resource.type == 'pipeline' ? '/pipelines/' + resource.id + '/runs' : resource.backPath}">查看平台运行记录</a></div>
  <article class="platform-card card mb-5"><div class="card-body">
    <form method="get" th:action="${resource.path()}" class="row g-5 align-items-end">
      <div class="md:col-6"><label for="workflow-code" class="form-label">执行链路版本</label><select class="form-control" id="workflow-code" name="workflowCode" aria-describedby="workflow-code-help" th:disabled="${#lists.isEmpty(resource.codes)}"><option th:each="code : ${resource.codes}" th:value="${code}" th:selected="${code == workflowCode}" th:text="${'工作流 ' + code}"></option></select></div>
      <div class="md:col-4"><label for="instance-state" class="form-label">执行状态</label><select class="form-control" id="instance-state" name="stateType"><option value="">全部状态</option><option th:each="state : ${stateFilters}" th:value="${state.key}" th:selected="${state.key == stateType}" th:text="${state.value}"></option></select></div>
      <div class="md:col-2"><button class="btn-solid theme-primary" type="submit" th:disabled="${#lists.isEmpty(resource.codes)}">查询</button></div>
    </form>
    <p class="form-text mb-0" id="workflow-code-help">保留已登记的历史链路；上游任务可查看其参与的加工链路。</p>
  </div></article>
  <article class="platform-card card"><div class="card-header d-flex justify-content-between gap-3"><span>工作流运行实例</span><small class="fw-normal fg-2">调度引擎实时查询 · 引擎时间</small></div><div class="card-body p-0"><div class="table-responsive"><table class="table table-hover mb-0">
    <thead><tr><th>实例 / 名称</th><th>状态</th><th>开始时间</th><th>结束时间</th><th>运行次数</th><th>操作</th></tr></thead><tbody>
    <tr th:each="instance : ${instances}"><td><a th:href="${resource.path() + '/instances/' + instance.id}" th:text="${'#' + instance.id}"></a><div class="small fg-2" th:text="${instance.name}"></div></td><td><span class="badge" th:classappend="${instance.state == 'SUCCESS' ? 'theme-success' : instance.state == 'FAILURE' ? 'theme-danger' : 'theme-info'}" th:text="${statusLabels[instance.state] ?: instance.state}"></span></td><td th:text="${instance.startedAt ?: '—'}"></td><td th:text="${#strings.isEmpty(instance.finishedAt) ? '—' : instance.finishedAt}"></td><td th:text="${instance.runTimes}"></td><td><a class="btn-outline theme-primary btn-sm" th:href="${resource.path() + '/instances/' + instance.id}">节点 / 日志</a></td></tr>
    <tr th:if="${#lists.isEmpty(instances)}"><td colspan="6" class="text-center fg-2 py-10" th:text="${engineError != null ? '暂时无法读取运行实例，请刷新重试。' : #lists.isEmpty(resource.codes) ? '当前任务暂无已登记的工作流。若曾作为上游运行，请从对应 数据加工链的运行实例查看。' : '当前条件下尚无运行实例。新提交的任务可能仍在排队，请稍后刷新。'}"></td></tr>
    </tbody></table></div></div></article>
  <div th:if="${!#lists.isEmpty(resource.codes)}" th:replace="~{fragments/pagination :: pagination}"></div>
  <p class="small fg-2 mt-5 mb-0">这里的实例编号来自 DolphinScheduler，与平台同步/SQL 运行记录编号独立。已提交不代表执行成功；日志保留时长由调度引擎决定。</p>
</section></body></html>
