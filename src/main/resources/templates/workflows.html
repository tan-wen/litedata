<!doctype html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout(~{::title}, ~{::section})}">
<head><title>数据加工 · LiteData</title></head>
<body>
<section>
  <link rel="stylesheet" th:href="@{/css/workflow-canvas.css}">
  <header class="page-topbar">
    <div th:replace="~{fragments/workspace :: context}"></div>
    <div class="page-heading d-flex flex-wrap justify-content-between align-items-center gap-4">
    <div><h1 class="page-title">数据加工</h1>
      <p class="page-subtitle mb-0">在画布中组合 SQL 任务依赖，并按 Cron 或数据就绪事件触发加工。</p></div>
    <a th:if="${canEdit}" class="btn-solid theme-primary" th:href="@{/workflows/new}">新建加工任务</a>
    <a th:replace="~{fragments/workspace :: back}"></a>
  </div>
  </header>
  <div th:replace="~{fragments/messages :: messages}"></div>
  <form class="workspace-section mb-5" method="get" th:action="@{/workflows}">
    <div class="card-body workflow-list-filters">
      <div class="workflow-filter-field"><label class="form-label" for="keyword">搜索</label><input class="form-control"
                                                                                                    id="keyword"
                                                                                                    name="keyword"
                                                                                                    th:value="${keyword}"
                                                                                                    maxlength="100"
                                                                                                    placeholder="名称或说明">
      </div>
      <div class="workflow-actions workflow-filter-actions">
        <button class="btn-outline theme-primary" type="submit">筛选</button>
        <a class="btn-link theme-secondary" th:href="@{/workflows}">重置</a></div>
    </div>
  </form>

  <article class="workspace-section">
    <div class="card-header">加工任务目录</div>
    <div class="card-body p-0">
      <div class="table-responsive">
        <table class="table table-hover task-list mb-0">
          <thead>
          <tr>
            <th>名称</th>
            <th>触发方式</th>
            <th>状态</th>
            <th>版本</th>
            <th>最近运行时间 <small class="fw-normal fg-2">北京时间</small></th>
            <th>操作</th>
          </tr>
          </thead>
          <tbody>
          <tr th:each="workflow : ${workflows}">
            <td><a th:href="@{/workflows/{id}(id=${workflow.id})}" th:text="${workflow.name}"></a>
              <div class="small fg-2" th:text="${workflow.description}"></div>
            </td>
            <td>
              <code th:if="${workflow.triggerMode == 'CRON'}" th:text="${workflow.cronExpression}"></code>
              <span th:if="${workflow.triggerMode == 'EVENT'}" th:text="${'数据就绪 · ' + (workflow.triggerSourceName ?: '未选择来源')}"></span>
            </td>
            <td><span class="badge"
                      th:classappend="${workflow.status == 'SCHEDULED' or workflow.status == 'EVENT_ENABLED' ? 'theme-success' : (workflow.status == 'SCHEDULE_PENDING' ? 'theme-warning' : 'theme-info')}"
                      th:text="${workflow.status == 'SCHEDULED' ? '定时已启用' : workflow.status == 'EVENT_ENABLED' ? '事件已启用' : workflow.status == 'SCHEDULE_PENDING' ? '待上线' : workflow.status == 'PAUSED' ? '已暂停' : '未启用'}"></span>
            </td>
            <td th:text="${'v' + workflow.version}"></td>
            <td class="text-nowrap"
                th:text="${workflow.lastRunAt != null ? #temporals.format(workflow.lastRunAt, 'yyyy-MM-dd HH:mm:ss') : '暂无执行记录'}"></td>
            <td>
              <div class="workflow-actions"><a th:if="${canEdit}" class="btn-link theme-primary btn-sm"
                                               th:href="@{/workflows/{id}/edit(id=${workflow.id})}">编辑</a><a
                class="btn-link theme-secondary btn-sm"
                th:href="@{/scheduling/workflow/{id}(id=${workflow.id})}">运行记录</a>
                <form th:if="${canEdit and workflow.status != 'SCHEDULED' and workflow.status != 'EVENT_ENABLED'}"
                      th:action="@{/workflows/{id}/scheduling/enable(id=${workflow.id})}" method="post">
                  <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                  <input type="hidden" name="version" th:value="${workflow.version}">
                  <input type="hidden" name="keyword" th:value="${keyword}">
                  <input type="hidden" name="pageNum" th:value="${pageNum}">
                  <input type="hidden" name="pageSize" th:value="${pageSize}">
                  <button class="btn-outline theme-primary btn-sm" type="submit" th:disabled="${workflow.reviewRequired}"
                          th:title="${workflow.reviewRequired ? '请先在画布中核对迁移后的输入表和依赖，并保存确认' : null}"
                          th:text="${workflow.triggerMode == 'EVENT' ? '启用事件订阅' : workflow.status == 'SCHEDULE_PENDING' ? '重试启用定时' : '启用定时'}"></button>
                </form>
                <form th:if="${canEdit and ((workflow.scheduleId != null and workflow.status != 'PAUSED') or workflow.status == 'EVENT_ENABLED')}"
                      th:action="@{/workflows/{id}/scheduling/pause(id=${workflow.id})}" method="post">
                  <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                  <input type="hidden" name="version" th:value="${workflow.version}">
                  <input type="hidden" name="keyword" th:value="${keyword}">
                  <input type="hidden" name="pageNum" th:value="${pageNum}">
                  <input type="hidden" name="pageSize" th:value="${pageSize}">
                  <button class="btn-outline theme-secondary btn-sm" type="submit"
                          th:text="${workflow.triggerMode == 'EVENT' ? '暂停事件订阅' : '暂停定时'}"></button>
                </form>
                <form th:if="${canEdit}" th:action="@{/workflows/{id}/delete(id=${workflow.id})}" method="post"
                      data-workflow-delete-form th:attr="data-workflow-name=${workflow.name}"><input type="hidden"
                                                                                                     th:name="${_csrf.parameterName}"
                                                                                                     th:value="${_csrf.token}"><input
                  type="hidden" name="version" th:value="${workflow.version}"><input type="hidden" name="keyword"
                                                                                     th:value="${keyword}"><input
                  type="hidden" name="pageNum" th:value="${pageNum}"><input type="hidden" name="pageSize"
                                                                            th:value="${pageSize}">
                  <button class="btn-outline theme-danger btn-sm" type="submit"
                          th:disabled="${workflow.status == 'SCHEDULED' or workflow.status == 'SCHEDULE_PENDING' or workflow.status == 'EVENT_ENABLED'}"
                          th:title="${workflow.status == 'SCHEDULED' or workflow.status == 'SCHEDULE_PENDING' or workflow.status == 'EVENT_ENABLED' ? '请先在列表中暂停定时或事件订阅，再删除任务' : '删除后归档所属 SQL；同步任务、物理数据和运行历史保留'}">
                    删除
                  </button>
                </form>
              </div>
            </td>
          </tr>
          <tr th:if="${#lists.isEmpty(workflows)}">
            <td colspan="6" class="text-center fg-2 py-10">暂无加工任务。创建后即可在画布中设计 SQL 加工和依赖。</td>
          </tr>
          </tbody>
        </table>
      </div>
    </div>
  </article>
  <div th:replace="~{fragments/pagination :: pagination}"></div>
  <dialog th:if="${canEdit}" class="workflow-sql-dialog" data-workflow-delete-dialog
          aria-labelledby="workflow-delete-title" aria-describedby="workflow-delete-description">
    <article class="workspace-section">
      <div class="card-header" id="workflow-delete-title">删除加工任务</div>
      <div class="card-body"><p>确认删除“<strong data-workflow-delete-name></strong>”？</p>
        <p id="workflow-delete-description">所属 SQL 任务将归档，同步任务、物理数据和运行历史将保留。</p>
        <div class="workflow-actions">
          <button class="btn-outline theme-secondary" type="button" data-workflow-delete-cancel autofocus>取消</button>
          <button class="btn-solid theme-danger" type="button" data-workflow-delete-confirm>确认删除</button>
        </div>
      </div>
    </article>
  </dialog>
  <script th:src="@{/js/workflow-list.js}" defer></script>
</section>
</body>
</html>
