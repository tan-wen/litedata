<!doctype html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/layout :: layout(~{::title}, ~{::section})}">
<head><title>工作流 · LiteData</title></head><body><section>
  <link rel="stylesheet" th:href="@{/css/workflow-canvas.css}">
  <div class="d-flex flex-wrap justify-content-between align-items-center gap-4 mb-7"><div><h1 class="page-title">工作流</h1><p class="page-subtitle mb-0">在画布中组合任务依赖，并集中运行、启用或暂停调度。</p></div><a th:if="${canEdit}" class="btn-solid theme-primary" th:href="@{/workflows/new}">新建工作流</a></div>
  <div th:replace="~{fragments/messages :: messages}"></div>
  <form class="platform-card card mb-5" method="get" th:action="@{/workflows}"><div class="card-body workflow-list-filters"><div><label class="form-label" for="keyword">搜索</label><input class="form-control" id="keyword" name="keyword" th:value="${keyword}" maxlength="100" placeholder="名称、描述或末端任务"></div><div class="workflow-actions"><button class="btn-outline theme-primary" type="submit">筛选</button><a class="btn-link theme-secondary" th:href="@{/workflows}">重置</a></div></div></form>
  <article class="platform-card card"><div class="card-header">工作流目录</div><div class="card-body p-0"><div class="table-responsive"><table class="table table-hover mb-0"><thead><tr><th>名称</th><th>末端任务</th><th>周期</th><th>状态</th><th>版本</th><th>操作</th></tr></thead><tbody>
    <tr th:each="workflow : ${workflows}"><td><a th:href="@{/workflows/{id}(id=${workflow.id})}" th:text="${workflow.name}"></a><div class="small fg-2" th:text="${workflow.description}"></div></td><td th:text="${workflow.rootName}"></td><td><code th:text="${workflow.cronExpression}"></code></td><td><span class="badge" th:classappend="${workflow.status == 'SCHEDULED' ? 'theme-success' : (workflow.status == 'SCHEDULE_PENDING' ? 'theme-warning' : 'theme-info')}" th:text="${workflow.status == 'SCHEDULED' ? '已启用' : workflow.status == 'SCHEDULE_PENDING' ? '待上线' : workflow.status == 'PAUSED' ? '已暂停' : '未启用'}"></span></td><td th:text="${'v' + workflow.version}"></td><td><div class="workflow-actions"><a class="btn-outline theme-primary btn-sm" th:href="@{/workflows/{id}(id=${workflow.id})}">画布</a><a class="btn-link theme-secondary btn-sm" th:href="@{/scheduling/workflow/{id}(id=${workflow.id})}">实例</a></div></td></tr>
    <tr th:if="${#lists.isEmpty(workflows)}"><td colspan="6" class="text-center fg-2 py-10">暂无工作流。请先创建加工任务，再选择一个末端 SQL 任务作为末端任务。</td></tr>
  </tbody></table></div></div></article><div th:replace="~{fragments/pagination :: pagination}"></div>
</section></body></html>
