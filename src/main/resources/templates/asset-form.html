<!doctype html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/layout :: layout(~{::title}, ~{::section})}">
<head><title>编辑目录信息 · LiteData</title></head><body><section>
  <div class="mb-7"><div class="page-kicker">数据治理 / <a th:href="@{/assets}">资产目录</a> / 编辑</div><h1 class="page-title">编辑目录信息</h1><p class="page-subtitle mb-0" th:text="${asset.name}"></p></div>
  <div th:replace="~{fragments/messages :: messages}"></div><div class="alert theme-info">此页维护资产的业务说明和治理信息，不会修改原始模型、指标或数据服务定义。</div>
  <article class="platform-card card"><div class="card-header">目录信息</div><div class="card-body"><form class="row g-4" th:action="@{${asset.path}}" th:object="${draft}" method="post"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><input type="hidden" th:field="*{version}"><div class="md:col-6"><label class="form-label" for="business-name">业务名称</label><input class="form-control" id="business-name" th:field="*{businessName}" maxlength="100" placeholder="留空时使用原资源名称"></div><div class="md:col-6"><label class="form-label" for="profile-area">主题域</label><input class="form-control" id="profile-area" th:field="*{subjectArea}" maxlength="100" placeholder="留空时使用原资源主题域"></div><div class="md:col-6"><label class="form-label" for="profile-owner">负责人</label><input class="form-control" id="profile-owner" th:field="*{owner}" maxlength="100" placeholder="留空时使用原资源负责人"></div><div class="md:col-6"><label class="form-label" for="profile-tags">标签</label><input class="form-control" id="profile-tags" th:field="*{tags}" maxlength="500" placeholder="用英文逗号分隔，例如：核心,经营分析"></div><div class="md:col-6"><label class="form-label" for="profile-frequency">更新频率</label><input class="form-control" id="profile-frequency" th:field="*{updateFrequency}" maxlength="100" placeholder="例如：每日 08:00"></div><div class="md:col-6"><label class="form-label" for="profile-sensitivity">敏感级别</label><select class="form-control" id="profile-sensitivity" th:field="*{sensitivity}"><option th:each="item : ${sensitivityOptions}" th:value="${item.key}" th:text="${item.value}"></option></select></div><div class="col-12"><label class="form-label" for="profile-description">业务说明</label><textarea class="form-control" id="profile-description" th:field="*{description}" rows="5" maxlength="2000" placeholder="说明资产的业务含义、使用场景和口径边界"></textarea></div><div class="col-12 d-flex flex-wrap gap-3"><button class="btn-solid theme-primary" type="submit">保存目录信息</button><a class="btn-outline theme-secondary" th:href="@{${asset.path}}">取消</a></div></form></div></article>
</section></body></html>
