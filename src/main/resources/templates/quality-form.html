<!doctype html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/layout :: layout(~{::title}, ~{::section})}">
<head><title>质量任务配置 · LiteData</title></head><body><section>
  <div class="mb-7"><div class="page-kicker">数据治理 / <a th:href="@{/quality}">数据质量</a></div><h1 class="page-title" th:text="${taskId == null ? '新增质量任务' : '编辑质量任务'}"></h1><p class="page-subtitle mb-0">配置异常扫描规则；保存校验失败时会保留已填写的任务和规则。</p></div>
  <div th:replace="~{fragments/messages :: messages}"></div>
  <form th:if="${canEdit}" th:object="${draft}" th:action="${taskId == null ? '/quality' : '/quality/' + taskId}" method="post" data-quality-form><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><input type="hidden" th:field="*{version}">
    <article class="platform-card card mb-5"><div class="card-header">任务定义</div><div class="card-body"><div class="row g-5"><div class="md:col-4"><label class="form-label">任务名称</label><input class="form-control" th:field="*{name}" required maxlength="100"></div><div class="md:col-4"><label class="form-label">数据源</label><select class="form-control" th:field="*{sourceId}"><option value="">Doris 数仓</option><option th:each="source : ${sources}" th:value="${source.id}" th:text="${source.name}"></option></select></div><div class="md:col-4"><label class="form-label">库表名</label><input class="form-control" th:field="*{tableName}" required maxlength="64" placeholder="dwd_orders"></div><div class="md:col-4"><label class="form-label">负责人</label><input class="form-control" th:field="*{owner}" required maxlength="100"></div><div class="md:col-8"><label class="form-label">说明</label><input class="form-control" th:field="*{description}" maxlength="1000"></div><div class="md:col-4"><label class="form-label">Cron 表达式</label><input class="form-control" th:field="*{cronExpression}" maxlength="100" placeholder="留空则手动运行"><div class="form-text">请直接填写 Cron；平台内置调度使用 Asia/Shanghai。</div></div><div class="md:col-4"><label class="form-label">时间字段（可选）</label><input class="form-control" th:field="*{timeColumn}" maxlength="100" placeholder="updated_at"><div class="form-text">仅填写时间字段时，才使用检测窗口。</div></div><div class="md:col-2"><label class="form-label">窗口小时</label><input class="form-control" th:field="*{windowHours}" type="number" min="1" max="8760"></div><div class="md:col-2"><label class="form-label">超时秒数</label><input class="form-control" th:field="*{timeoutSeconds}" type="number" min="1" max="120" required></div></div></div></article>
    <article class="platform-card card mb-5"><div class="card-header d-flex justify-content-between align-items-center">扫描规则 <button type="button" class="btn-outline theme-primary btn-sm" data-quality-add-rule>添加规则</button></div><div class="card-body"><p class="fg-2">最多 30 条。计数和比例容忍均未超过才通过；均为 0 表示不容忍。聚合规则失败时按 1 条异常、1 条检测记录。</p><div data-quality-rules><div th:each="rule,stat : *{rules}" class="border rounded p-4 mb-4" data-quality-rule><div class="d-flex justify-content-between gap-3 mb-3"><strong th:text="${'规则 ' + (stat.count)}"></strong><button class="btn-link theme-danger btn-sm" type="button" data-quality-remove>删除</button></div><div class="row g-3"><div class="md:col-3"><label class="form-label">规则名称</label><input class="form-control" th:field="*{rules[__${stat.index}__].name}" required maxlength="100"></div><div class="md:col-3"><label class="form-label">类型</label><select class="form-control" th:field="*{rules[__${stat.index}__].type}" data-quality-type required><option value="">请选择</option><option th:each="item : ${ruleTypes}" th:value="${item.name}" th:text="${item.label}" th:attr="data-hint=${item.hint}"></option></select></div><div class="md:col-3"><label class="form-label">字段</label><input class="form-control" th:field="*{rules[__${stat.index}__].columns}" maxlength="500" placeholder="可用逗号分隔多个字段"></div><div class="md:col-3"><label class="form-label">严重级别</label><select class="form-control" th:field="*{rules[__${stat.index}__].severity}"><option value="WARNING">警告</option><option value="CRITICAL">严重</option></select></div><div class="md:col-3"><label class="form-label">参数 1</label><textarea class="form-control" th:field="*{rules[__${stat.index}__].parameter1}" maxlength="20000" rows="3" data-quality-param="one"></textarea></div><div class="md:col-3"><label class="form-label">参数 2</label><input class="form-control" th:field="*{rules[__${stat.index}__].parameter2}" maxlength="1000" data-quality-param="two"></div><div class="md:col-3"><label class="form-label">引用表</label><input class="form-control" th:field="*{rules[__${stat.index}__].referenceTable}" maxlength="200" data-quality-reference="table"></div><div class="md:col-3"><label class="form-label">引用字段</label><input class="form-control" th:field="*{rules[__${stat.index}__].referenceColumn}" maxlength="100" data-quality-reference="column"></div><div class="md:col-3"><label class="form-label">容忍异常数</label><input class="form-control" th:field="*{rules[__${stat.index}__].toleranceCount}" type="number" min="0"></div><div class="md:col-3"><label class="form-label">容忍异常比例（%）</label><input class="form-control" th:field="*{rules[__${stat.index}__].tolerancePercent}" type="number" min="0" max="100" step="0.01"></div><div class="col-12 form-text" data-quality-hint></div></div></div></div><p class="fg-2 mb-0" data-quality-empty th:classappend="${!#lists.isEmpty(draft.rules)} ? ' d-none'">尚未添加规则。</p></div></article>
    <div class="d-flex gap-3"><button class="btn-solid theme-primary" type="submit">保存质量任务</button><a class="btn-outline theme-secondary" th:href="${taskId == null ? '/quality' : '/quality/' + taskId}">取消</a></div>
  </form><p th:unless="${canEdit}" class="alert theme-info">当前账号仅可查看任务。</p>
  <template id="quality-rule-template"><div class="border rounded p-4 mb-4" data-quality-rule><div class="d-flex justify-content-between gap-3 mb-3"><strong>规则</strong><button class="btn-link theme-danger btn-sm" type="button" data-quality-remove>删除</button></div><div class="row g-3"><div class="md:col-3"><label class="form-label">规则名称</label><input class="form-control" data-quality-field="name" required maxlength="100"></div><div class="md:col-3"><label class="form-label">类型</label><select class="form-control" data-quality-field="type" data-quality-type required><option value="">请选择</option><option th:each="item : ${ruleTypes}" th:value="${item.name}" th:text="${item.label}" th:attr="data-hint=${item.hint}"></option></select></div><div class="md:col-3"><label class="form-label">字段</label><input class="form-control" data-quality-field="columns" maxlength="500" placeholder="可用逗号分隔多个字段"></div><div class="md:col-3"><label class="form-label">严重级别</label><select class="form-control" data-quality-field="severity"><option value="WARNING">警告</option><option value="CRITICAL">严重</option></select></div><div class="md:col-3"><label class="form-label">参数 1</label><textarea class="form-control" data-quality-field="parameter1" maxlength="20000" rows="3" data-quality-param="one"></textarea></div><div class="md:col-3"><label class="form-label">参数 2</label><input class="form-control" data-quality-field="parameter2" maxlength="1000" data-quality-param="two"></div><div class="md:col-3"><label class="form-label">引用表</label><input class="form-control" data-quality-field="referenceTable" maxlength="200" data-quality-reference="table"></div><div class="md:col-3"><label class="form-label">引用字段</label><input class="form-control" data-quality-field="referenceColumn" maxlength="100" data-quality-reference="column"></div><div class="md:col-3"><label class="form-label">容忍异常数</label><input class="form-control" data-quality-field="toleranceCount" type="number" min="0" value="0"></div><div class="md:col-3"><label class="form-label">容忍异常比例（%）</label><input class="form-control" data-quality-field="tolerancePercent" type="number" min="0" max="100" step="0.01" value="0"></div><div class="col-12 form-text" data-quality-hint></div></div></div></template><script th:src="@{/js/quality.js}" defer></script>
</section></body></html>
