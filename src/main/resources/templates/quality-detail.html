<!doctype html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/layout :: layout(~{::title}, ~{::section})}">
<head><title>质量任务详情 · LiteData</title></head><body><section>
  <div class="d-flex flex-wrap justify-content-between align-items-start mb-7 gap-5"><div><div class="page-kicker">数据治理 / <a th:href="@{/quality}">数据质量</a></div><h1 class="page-title" th:text="${task.name}"></h1><p class="page-subtitle mb-0"><span th:text="${(task.sourceId == null ? 'Doris' : '数据源') + ' · ' + task.tableName}"></span> · <span th:text="${'v' + task.version}"></span></p></div><a th:if="${canEdit}" class="btn-outline theme-primary" th:href="@{/quality/{id}/edit(id=${task.id})}">编辑任务</a></div>
  <div th:replace="~{fragments/messages :: messages}"></div>
  <div class="alert theme-info">配置定时：平台内置调度，Asia/Shanghai，服务在线时运行。</div>
  <div class="row g-5 mb-5"><div class="xl:col-8"><article class="platform-card card h-100"><div class="card-header">扫描配置</div><div class="card-body"><dl class="row mb-0"><dt class="sm:col-3">负责人</dt><dd class="sm:col-9" th:text="${task.owner ?: '—'}"></dd><dt class="sm:col-3">说明</dt><dd class="sm:col-9" th:text="${task.description ?: '—'}"></dd><dt class="sm:col-3">时间窗口</dt><dd class="sm:col-9" th:text="${#strings.isEmpty(task.timeColumn) ? '全表扫描' : task.timeColumn + '，最近 ' + task.windowHours + ' 小时'}"></dd><dt class="sm:col-3">超时</dt><dd class="sm:col-9" th:text="${task.timeoutSeconds + ' 秒'}"></dd><dt class="sm:col-3">调度</dt><dd class="sm:col-9"><code th:text="${#strings.isEmpty(task.cronExpression) ? '手动运行' : task.cronExpression}"></code><span th:if="${task.nextRunAt != null}" class="fg-2 ms-3" th:text="${'下次：' + #temporals.format(task.nextRunAt, 'yyyy-MM-dd HH:mm:ss')}"></span></dd></dl></div></article></div><div class="xl:col-4"><article class="platform-card card h-100"><div class="card-header">运行与调度</div><div class="card-body"><div th:if="${canEdit}" class="d-flex flex-wrap gap-3"><form th:action="@{/quality/{id}/run(id=${task.id})}" method="post"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><input type="hidden" name="version" th:value="${task.version}"><button class="btn-solid theme-primary" type="submit">立即运行</button></form><form th:if="${!#strings.isEmpty(task.cronExpression)}" th:action="@{/quality/{id}/schedule(id=${task.id})}" method="post"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><input type="hidden" name="version" th:value="${task.version}"><button class="btn-outline theme-primary" type="submit" th:text="${task.enabled ? '更新定时' : '启用定时'}"></button></form><form th:if="${task.enabled}" th:action="@{/quality/{id}/pause(id=${task.id})}" method="post"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><input type="hidden" name="version" th:value="${task.version}"><button class="btn-outline theme-secondary" type="submit">暂停定时</button></form></div><p class="small fg-2 mt-5 mb-0" th:text="${task.activeRunId != null ? '当前已有扫描在运行，请等待完成。' : '手动运行会按当前配置建立执行快照。'}"></p></div></article></div></div>
  <article class="platform-card card mb-5"><div class="card-header">扫描规则</div><div class="card-body p-0"><div class="table-responsive"><table class="table mb-0"><thead><tr><th>名称</th><th>类型</th><th>字段</th><th>参数</th><th>容忍</th><th>级别</th></tr></thead><tbody><tr th:each="rule : ${rules}"><td th:text="${rule.name}"></td><td th:text="${rule.type.label}"></td><td th:text="${rule.columns ?: '—'}"></td><td class="modeling-diff"><span th:text="${rule.parameter1 ?: '—'}"></span><span th:if="${!#strings.isEmpty(rule.parameter2)}" th:text="${' ~ ' + rule.parameter2}"></span><span th:if="${!#strings.isEmpty(rule.referenceTable)}" th:text="${'；引用 ' + rule.referenceTable + '.' + rule.referenceColumn}"></span></td><td th:text="${rule.toleranceCount + ' 条 / ' + rule.tolerancePercent + '%'}"></td><td><span class="badge" th:classappend="${rule.severity == 'CRITICAL' ? 'theme-danger' : 'theme-warning'}" th:text="${rule.severity == 'CRITICAL' ? '严重' : '警告'}"></span></td></tr><tr th:if="${#lists.isEmpty(rules)}"><td colspan="6" class="text-center fg-2 py-7">尚未配置扫描规则。</td></tr></tbody></table></div></div></article>
  <article class="platform-card card mb-5"><div class="card-header">运行记录 <small class="fw-normal fg-2">北京时间</small></div><div class="card-body p-0"><div class="table-responsive"><table class="table mb-0"><thead><tr><th>实例</th><th>状态</th><th>发起人</th><th>任务版本</th><th>开始 / 结束</th><th>消息</th></tr></thead><tbody><tr th:each="run : ${runs}"><td><a th:href="@{/quality/runs/{id}(id=${run.id})}" th:text="${run.id}"></a></td><td><span class="badge" th:classappend="${run.status == 'PASSED' ? 'theme-success' : run.status == 'WARNING' ? 'theme-warning' : run.status == 'RUNNING' ? 'theme-info' : 'theme-danger'}" th:text="${run.statusLabel}"></span></td><td th:text="${run.actor ?: '系统'}"></td><td th:text="${'v' + run.taskVersion}"></td><td><div th:text="${#temporals.format(run.startedAt, 'MM-dd HH:mm:ss')}"></div><div th:if="${run.finishedAt != null}" th:text="${#temporals.format(run.finishedAt, 'MM-dd HH:mm:ss')}"></div></td><td class="modeling-diff" th:text="${run.message}"></td></tr><tr th:if="${#lists.isEmpty(runs)}"><td colspan="6" class="text-center fg-2 py-7">尚无运行记录。</td></tr></tbody></table></div></div></article>
  <div th:replace="~{fragments/pagination :: pagination}"></div><details th:if="${canEdit}"><summary class="fg-2">归档任务</summary><form class="mt-3" th:action="@{/quality/{id}/archive(id=${task.id})}" method="post"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><input type="hidden" name="version" th:value="${task.version}"><p>归档会保留配置与运行记录，不能再执行或调度。</p><button class="btn-outline theme-danger btn-sm" type="submit">确认归档</button></form></details>
</section></body></html>
