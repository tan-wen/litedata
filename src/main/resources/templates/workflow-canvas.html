<!doctype html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/layout :: layout(~{::title}, ~{::section})}">
<head><title>工作流画布 · LiteData</title></head><body><section data-workflow-canvas
  th:attr="data-workflow-id=${workflow.id},data-graph-url=@{/workflows/{id}/graph(id=${workflow.id})},data-catalog-url=@{/workflows/{id}/catalog(id=${workflow.id})},data-expand-url=@{/workflows/{id}/expand(id=${workflow.id})},data-editable=${canEdit}">
  <link rel="stylesheet" th:href="@{/css/workflow-canvas.css}"><link rel="stylesheet" th:href="@{/css/scheduling.css}">
  <div class="d-flex flex-wrap justify-content-between align-items-start gap-5 mb-5"><div><h1 class="page-title" th:text="${workflow.name}"></h1><p class="page-subtitle mb-0" th:text="${workflow.description ?: '未填写说明'}"></p></div><div class="d-flex gap-3"><a th:if="${canEdit}" class="btn-outline theme-secondary" th:href="@{/workflows/{id}/edit(id=${workflow.id})}">编辑信息</a><a class="btn-outline theme-secondary" th:href="@{/scheduling/workflow/{id}(id=${workflow.id})}">运行实例</a></div></div>
  <p class="small fg-2" th:text="${'末端任务：' + rootTask.name + ' · ' + schedules[workflow.cronExpression] + ' · 北京时间 · ' + workflow.status}"></p>
  <div th:if="${canEdit}" class="workflow-runbar platform-card card mb-5"><div class="card-body d-flex flex-wrap gap-3 align-items-center"><span class="small fg-2">集中运行与调度</span>
    <form th:action="@{/workflows/{id}/run(id=${workflow.id})}" method="post" data-workflow-action><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><input type="hidden" name="version" th:value="${workflow.version}" data-workflow-version><input type="hidden" name="graphHash" data-workflow-hash><button class="btn-solid theme-primary" type="submit">运行</button></form>
    <form th:if="${workflow.status != 'SCHEDULED'}" th:action="@{/workflows/{id}/schedule(id=${workflow.id})}" method="post" data-workflow-action><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><input type="hidden" name="version" th:value="${workflow.version}" data-workflow-version><input type="hidden" name="graphHash" data-workflow-hash><button class="btn-outline theme-primary" type="submit">启用定时</button></form>
    <form th:if="${workflow.scheduleId != null and workflow.status != 'PAUSED'}" th:action="@{/workflows/{id}/pause(id=${workflow.id})}" method="post" data-workflow-action><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><input type="hidden" name="version" th:value="${workflow.version}" data-workflow-version><input type="hidden" name="graphHash" data-workflow-hash><button class="btn-outline theme-secondary" type="submit">暂停</button></form>
    <label class="small ms-auto">周期（北京时间）<select class="form-control form-control-sm workflow-cron" data-workflow-cron data-schedule-cron><option th:each="schedule : ${schedules}" th:value="${schedule.key}" th:text="${schedule.value}"></option></select></label>
    <div class="schedule-preview small" data-schedule-preview aria-live="polite"><span>正在计算北京时间计划…</span></div>
  </div></div>
  <div th:replace="~{fragments/messages :: messages}"></div>
  <p class="small fg-2">点击端口建立上游到下游的依赖；移出节点只调整依赖，保留任务与历史。共享任务的依赖变更会影响其他引用它的工作流。</p>
  <div class="workflow-toolbar mb-3"><div class="d-flex flex-wrap gap-3"><button class="btn-outline theme-primary btn-sm" type="button" data-workflow-layout>自动布局</button><button class="btn-outline theme-secondary btn-sm" type="button" data-workflow-zoom="in">放大</button><button class="btn-outline theme-secondary btn-sm" type="button" data-workflow-zoom="out">缩小</button><button class="btn-outline theme-secondary btn-sm" type="button" data-workflow-zoom="fit">适应画布</button><button th:if="${canEdit}" class="btn-outline theme-danger btn-sm" type="button" data-workflow-delete disabled>删除选中</button></div><span class="small fg-2" data-workflow-status role="status">正在加载画布…</span></div>
  <div class="workflow-layout" th:classappend="${!canEdit} ? 'workflow-readonly'"><aside th:if="${canEdit}" class="platform-card card workflow-palette"><div class="card-header">添加任务</div><div class="card-body"><div class="d-flex flex-wrap gap-3 mb-3"><a class="btn-link theme-primary btn-sm" th:href="@{/transforms/new(workflowId=${workflow.id})}">新增加工任务</a><a class="btn-link theme-primary btn-sm" th:href="@{/pipelines/new(workflowId=${workflow.id})}">新增同步管道</a></div><label class="form-label" for="workflow-catalog">搜索目录</label><input id="workflow-catalog" class="form-control" type="search" data-workflow-catalog placeholder="任务或目标表"><div class="workflow-catalog-list" data-workflow-catalog-list></div><div class="d-flex justify-content-between align-items-center mt-3"><button class="btn-outline theme-secondary btn-sm" type="button" data-catalog-prev>上一页</button><span class="small fg-2" data-catalog-page></span><button class="btn-outline theme-secondary btn-sm" type="button" data-catalog-next>下一页</button></div><label class="form-label mt-4" for="workflow-connect-from">上游节点</label><select id="workflow-connect-from" class="form-control" data-workflow-connect-from></select><label class="form-label mt-3" for="workflow-connect-to">下游加工任务</label><select id="workflow-connect-to" class="form-control" data-workflow-connect-to></select><button class="btn-outline theme-primary btn-sm mt-3" type="button" data-workflow-connect>添加连线</button><p class="small fg-2 mt-3 mb-0">添加任务会并入其已有上游。共享任务的依赖为全局修改。</p></div></aside><div class="workflow-stage-wrap"><div class="workflow-stage" data-workflow-stage tabindex="0" aria-label="工作流依赖画布，可拖动节点并通过端口连线"><svg data-workflow-edges aria-hidden="true"></svg><div data-workflow-nodes></div></div></div></div>
  <div class="alert theme-warning mt-4" data-workflow-error hidden></div><div th:if="${canEdit}" class="d-flex gap-3 mt-4"><button class="btn-solid theme-primary" type="button" data-workflow-save>保存画布</button><a class="btn-outline theme-secondary" th:href="@{/workflows}">返回工作流</a></div>
  <script th:inline="javascript">window.workflowCanvas = /*[[${workflow}]]*/ {};</script><script th:src="@{/js/workflow-canvas.js}" defer></script><script th:src="@{/js/schedule-settings.js}" defer></script>
</section></body></html>
