<!doctype html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="pagination" class="list-pagination">
  <div class="list-pagination-summary fg-2" th:text="${'共 ' + totalCount + ' 条，共 ' + totalPages + ' 页'}"></div>
  <div class="list-pagination-controls">
    <form class="list-pagination-size" th:action="@{${pagePath}}" method="get">
      <input type="hidden" name="pageNum" value="1">
      <input th:if="${keyword != null}" type="hidden" name="keyword" th:value="${keyword}">
      <input th:if="${layer != null}" type="hidden" name="layer" th:value="${layer}">
      <input th:if="${metricType != null}" type="hidden" name="metricType" th:value="${metricType}">
      <input th:if="${assetType != null}" type="hidden" name="assetType" th:value="${assetType}">
      <input th:if="${assetCategory != null}" type="hidden" name="assetCategory" th:value="${assetCategory}">
      <input th:if="${subjectArea != null}" type="hidden" name="subjectArea" th:value="${subjectArea}">
      <input th:if="${owner != null}" type="hidden" name="owner" th:value="${owner}">
      <input th:if="${tag != null}" type="hidden" name="tag" th:value="${tag}">
      <input th:if="${assetStatus != null}" type="hidden" name="assetStatus" th:value="${assetStatus}">
      <input th:if="${workflowCode != null}" type="hidden" name="workflowCode" th:value="${workflowCode}">
      <input th:if="${stateType != null}" type="hidden" name="stateType" th:value="${stateType}">
      <input th:if="${taskId != null}" type="hidden" name="taskId" th:value="${taskId}">
      <label class="text-nowrap fg-2" for="list-page-size">每页</label>
      <select class="form-control form-control-sm w-auto" id="list-page-size" name="pageSize" aria-label="每页条数">
        <option th:if="${!#lists.contains(pageSizes,pageSize)}" th:value="${pageSize}" th:text="${pageSize}"
                selected></option>
        <option th:each="size : ${pageSizes}" th:value="${size}" th:text="${size}"
                th:selected="${size == pageSize}"></option>
      </select>
    </form>
    <nav class="list-pagination-nav" aria-label="列表分页">
      <ul class="pagination theme-primary pagination-sm mb-0">
        <li class="page-item" th:classappend="${!hasPrevious} ? 'disabled'">
          <a th:if="${hasPrevious}" class="page-link" aria-label="上一页"
             th:href="@{${pagePath}(pageNum=${pageNum - 1},pageSize=${pageSize},keyword=${keyword},layer=${layer},metricType=${metricType},assetType=${assetType},assetCategory=${assetCategory},subjectArea=${subjectArea},owner=${owner},tag=${tag},assetStatus=${assetStatus},workflowCode=${workflowCode},stateType=${stateType},taskId=${taskId})}"><span
            aria-hidden="true">&laquo;</span></a>
          <span th:unless="${hasPrevious}" class="page-link" aria-disabled="true" aria-label="上一页"><span
            aria-hidden="true">&laquo;</span></span>
        </li>
        <li th:each="number : ${pageNumbers}" class="page-item"
            th:classappend="${number == 0 ? 'disabled' : (number == pageNum ? 'active' : '')}">
          <span th:if="${number == 0}" class="page-link" aria-hidden="true">...</span>
          <span th:if="${number == pageNum}" class="page-link" aria-current="page"
                th:attr="aria-label=${'第 ' + number + ' 页，当前页'}" th:text="${number}"></span>
          <a th:if="${number != 0 and number != pageNum}" class="page-link"
             th:attr="aria-label=${'第 ' + number + ' 页'}" th:text="${number}"
             th:href="@{${pagePath}(pageNum=${number},pageSize=${pageSize},keyword=${keyword},layer=${layer},metricType=${metricType},assetType=${assetType},assetCategory=${assetCategory},subjectArea=${subjectArea},owner=${owner},tag=${tag},assetStatus=${assetStatus},workflowCode=${workflowCode},stateType=${stateType},taskId=${taskId})}"></a>
        </li>
        <li class="page-item" th:classappend="${!hasMore} ? 'disabled'">
          <a th:if="${hasMore}" class="page-link" aria-label="下一页"
             th:href="@{${pagePath}(pageNum=${pageNum + 1},pageSize=${pageSize},keyword=${keyword},layer=${layer},metricType=${metricType},assetType=${assetType},assetCategory=${assetCategory},subjectArea=${subjectArea},owner=${owner},tag=${tag},assetStatus=${assetStatus},workflowCode=${workflowCode},stateType=${stateType},taskId=${taskId})}"><span
            aria-hidden="true">&raquo;</span></a>
          <span th:unless="${hasMore}" class="page-link" aria-disabled="true" aria-label="下一页"><span
            aria-hidden="true">&raquo;</span></span>
        </li>
      </ul>
    </nav>
  </div>
</div>
</body>
</html>
