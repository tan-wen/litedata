<div xmlns:th="http://www.thymeleaf.org" th:fragment="messages">
  <div class="alert theme-warning" role="alert" th:if="${apiKey}">
    <div><p class="mb-1">请立即保存 API 凭证，本次显示后无法再次查看：</p>
      <code class="user-select-all text-break" th:text="${apiKey}"></code></div>
  </div>
  <div hidden data-platform-notification="success" th:if="${success}" th:text="${success}">操作成功</div>
  <div hidden data-platform-notification="danger" th:if="${error}" th:text="${error}">操作失败</div>
</div>
