<!doctype html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/layout :: layout(~{::title}, ~{::section})}">
<head><title>SQL 加工 · LiteData</title></head><body><section>
  <link rel="stylesheet" th:href="@{/css/workflow-canvas.css}">
  <div class="d-flex justify-content-between align-items-start mb-7 gap-5"><div><h1 class="page-title" th:text="${task.name}"></h1><p class="page-subtitle mb-0" th:text="${task.layer + ' / warehouse.' + task.targetTable + ' · v' + task.version}"></p></div><a th:if="${canEdit}" class="btn-outline theme-primary" th:href="@{/transforms/{id}/edit(id=${task.id},returnTo='detail')}">编辑任务</a></div>
  <div th:replace="~{fragments/messages :: messages}"></div>
  <div class="alert theme-info">SQL 加工只维护名称、目标模型和 SQL。依赖、Cron、调度状态和运行由所属工作流管理。</div>
  <div class="d-flex flex-wrap gap-3 mb-5"><a th:if="${canEdit}" class="btn-solid theme-primary" th:href="@{/workflows/new}">新建工作流</a><a class="btn-outline theme-secondary" href="#platform-runs">平台 SQL 记录</a></div>
  <article class="platform-card card mb-5"><div class="card-header">本节点 SQL</div><div class="card-body"><pre class="code-preview mb-0" th:text="${task.sqlText}"></pre></div></article>
  <article class="platform-card card mb-5"><div class="card-header">所属工作流</div><div class="card-body"><p th:if="${#lists.isEmpty(taskWorkflows)}" class="fg-2 mb-0">此任务尚未加入工作流。</p><div th:unless="${#lists.isEmpty(taskWorkflows)}" class="workflow-actions"><a th:each="workflow : ${taskWorkflows}" class="btn-outline theme-primary btn-sm" th:href="@{/workflows/{id}(id=${workflow.id})}" th:text="${workflow.name}"></a></div></div></article>
  <article id="platform-runs" class="platform-card card mb-5"><div class="card-header">SQL 节点运行记录 <small class="fw-normal fg-2">最近 100 条 · 北京时间</small></div><div class="card-body p-0"><div class="table-responsive"><table class="table mb-0"><thead><tr><th>实例</th><th>任务 / 版本</th><th>发起工作流</th><th>状态</th><th>开始 / 结束</th><th>详情</th></tr></thead><tbody><tr th:each="run : ${runs}"><td th:text="${run.id}"></td><td><span th:text="${run.taskName}"></span> / <span th:text="${'v' + run.taskVersion}"></span></td><td th:text="${run.rootName}"></td><td><span class="badge" th:classappend="${run.status == 'SUCCESS' ? 'theme-success' : run.status == 'RUNNING' ? 'theme-warning' : 'theme-danger'}" th:text="${run.status}"></span></td><td><div th:text="${#temporals.format(run.startedAt, 'MM-dd HH:mm:ss')}"></div><div th:if="${run.finishedAt != null}" th:text="${#temporals.format(run.finishedAt, 'MM-dd HH:mm:ss')}"></div></td><td class="modeling-diff"><span th:text="${run.message}"></span><details><summary>查看执行 SQL</summary><pre class="code-preview" th:text="${run.sqlText}"></pre></details></td></tr><tr th:if="${#lists.isEmpty(runs)}"><td colspan="6" class="text-center fg-2 py-7">尚无 SQL 节点执行记录。若上游失败，下游不会产生执行记录。</td></tr></tbody></table></div></div><div class="card-footer bg-body small fg-2">同步节点的实例及水位请在<a th:href="@{/pipelines}">同步管道</a>查看，完整工作流状态与节点日志请进入对应工作流。</div></article>
  <details th:if="${canEdit}"><summary class="fg-2">归档任务</summary><form class="mt-3" th:action="@{/transforms/{id}/archive(id=${task.id})}" method="post"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><input type="hidden" name="version" th:value="${task.version}"><p>先从所有工作流移除任务后再归档。保留物理数据和运行记录，任务名与目标模型仍占用。</p><button class="btn-outline theme-danger btn-sm" type="submit">确认归档</button></form></details>
</section></body></html>
