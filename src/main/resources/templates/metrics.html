<!doctype html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/layout :: layout(~{::title}, ~{::section})}">
<head><title>指标管理 · LiteData</title></head><body><section>
  <div class="d-flex flex-wrap justify-content-between align-items-center mb-7 gap-5"><div><h1 class="page-title">指标管理</h1><p class="page-subtitle mb-0">维护可复用的原子、派生和复合指标定义，以及每次保存时固定的 SQL 快照。</p></div><a th:if="${canEdit}" class="btn-solid theme-primary" th:href="@{/metrics/new(type=ATOMIC)}">新增指标</a></div>
  <div th:replace="~{fragments/messages :: messages}"></div>
  <article class="platform-card card"><div class="card-header">指标目录</div><div class="card-body">
    <form class="row g-3 mb-5" th:action="@{/metrics}" method="get"><div class="sm:col-5"><label class="visually-hidden" for="metric-keyword">搜索指标</label><input id="metric-keyword" class="form-control" name="keyword" th:value="${keyword}" maxlength="100" placeholder="编码、名称、主题域或负责人"></div><div class="sm:col-4"><label class="visually-hidden" for="metric-type">指标类型</label><select id="metric-type" class="form-control" name="metricType"><option value="">全部类型</option><option th:each="item : ${metricTypes}" th:value="${item.name}" th:text="${item.label}" th:selected="${metricType == item.name}"></option></select></div><div class="sm:col-3"><button class="btn-outline theme-primary" type="submit">查询</button><a class="btn-link theme-primary" th:href="@{/metrics}">重置</a></div></form>
    <div class="table-responsive"><table class="table table-hover mb-0"><thead><tr><th>编码 / 名称</th><th>类型</th><th>主题域</th><th>维度</th><th>负责人</th><th>版本</th><th>操作</th></tr></thead><tbody>
      <tr th:each="metric : ${metrics}"><td><a th:href="@{/metrics/{id}(id=${metric.id})}" th:text="${metric.code}"></a><div class="small fg-2" th:text="${metric.name}"></div></td><td><span class="badge theme-info" th:text="${metric.type.label}"></span></td><td th:text="${metric.subjectArea ?: '—'}"></td><td class="modeling-diff" th:text="${#strings.isEmpty(metric.dimensions) ? '无维度' : metric.dimensions}"></td><td th:text="${metric.owner ?: '—'}"></td><td th:text="${'v' + metric.version}"></td><td><a class="btn-outline theme-primary btn-sm" th:href="@{/metrics/{id}(id=${metric.id})}">查看</a> <a class="btn-link theme-primary btn-sm" th:href="@{/metrics/{id}/lineage(id=${metric.id})}">血缘</a> <a th:if="${canEdit}" class="btn-link theme-primary btn-sm" th:href="@{/metrics/{id}/edit(id=${metric.id})}">编辑</a></td></tr>
      <tr th:if="${#lists.isEmpty(metrics)}"><td colspan="7" class="text-center fg-2 py-10">暂无指标。可先从一个绑定模型的原子指标开始。</td></tr>
    </tbody></table></div>
  </div></article>
  <div th:replace="~{fragments/pagination :: pagination}"></div>
</section></body></html>
