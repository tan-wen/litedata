<!doctype html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/layout :: layout(~{::title}, ~{::section})}">
<head><title>数据源 · 数据中台</title></head>
<body>
<section>
  <div class="mb-4"><div class="page-kicker">数据开发 / 数据源</div><h1 class="page-title">数据源</h1><p class="page-subtitle mb-0">登记要同步的 MySQL 连接；密码只在提交时接收，不会回显。</p></div>
  <div th:replace="~{fragments/messages :: messages}"></div>
  <div class="row g-3 align-items-start">
    <div class="col-xl-8"><article class="platform-card card"><div class="card-header">已登记数据源</div><div class="card-body p-0"><div class="table-responsive"><table class="table table-hover mb-0"><thead><tr><th>名称</th><th>JDBC 地址</th><th>用户名</th><th>状态</th><th>最近错误</th><th>操作</th></tr></thead><tbody><tr th:each="source : ${sources}"><td class="fw-semibold" th:text="${source.name}">业务主库</td><td th:text="${source.jdbcUrl}">jdbc:mysql://localhost:3306/demo</td><td th:text="${source.username}">reader</td><td><span class="badge status status-info" th:text="${source.status}">READY</span></td><td class="text-danger text-truncate" style="max-width:180px" th:text="${source.lastError}">-</td><td><form class="d-inline" th:action="@{/sources/{id}/test(id=${source.id})}" method="post"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><button class="btn btn-sm btn-outline-primary" type="submit">测试连接</button></form></td></tr><tr th:if="${#lists.isEmpty(sources)}"><td colspan="6" class="text-center text-secondary py-4">暂无数据源，请先添加一个 MySQL 数据源。</td></tr></tbody></table></div></div></article></div>
    <div class="col-xl-4"><article class="platform-card card"><div class="card-header">新增数据源</div><div class="card-body"><form th:if="${canEdit}" th:action="@{/sources}" method="post"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><div class="mb-3"><label class="form-label" for="name">名称</label><input class="form-control" id="name" name="name" required maxlength="100" placeholder="例如：业务主库"></div><div class="mb-3"><label class="form-label" for="jdbcUrl">JDBC 地址</label><input class="form-control" id="jdbcUrl" name="jdbcUrl" required placeholder="jdbc:mysql://host:3306/database"></div><div class="mb-3"><label class="form-label" for="username">用户名</label><input class="form-control" id="username" name="username" required autocomplete="off"></div><div class="mb-3"><label class="form-label" for="password">密码</label><input class="form-control" id="password" name="password" type="password" required autocomplete="new-password"></div><button class="btn btn-primary w-100" type="submit">保存数据源</button></form></div></article></div>
  </div>
</section>
</body>
</html>
