<!doctype html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/layout :: layout(~{::title}, ~{::section})}">
<head><title>数据源 · 数据中台</title></head>
<body><section>
  <div class="d-flex justify-content-between align-items-start mb-7 gap-5"><div><div class="page-kicker">数据开发 / 数据源</div><h1 class="page-title">数据源</h1><p class="page-subtitle mb-0">登记要同步的 MySQL 连接；密码只在提交时接收，不会回显。</p></div><a th:if="${canEdit}" class="btn-solid theme-primary" th:href="@{/sources/new}">新增数据源</a></div>
  <div th:replace="~{fragments/messages :: messages}"></div>
  <article class="platform-card card"><div class="card-header">已登记数据源</div><div class="card-body p-0"><div class="table-responsive"><table class="table table-hover mb-0"><thead><tr><th>名称</th><th>JDBC 地址</th><th>用户名</th><th>状态</th><th>最近错误</th><th>操作</th></tr></thead><tbody><tr th:each="source : ${sources}"><td class="fw-semibold" th:text="${source.name}">业务主库</td><td th:text="${source.jdbcUrl}">jdbc:mysql://localhost:3306/demo</td><td th:text="${source.username}">reader</td><td><span class="badge theme-info" th:text="${source.status}">READY</span></td><td class="fg-danger text-truncate" style="max-width:180px" th:text="${source.lastError}">-</td><td><div class="d-flex gap-1"><a th:if="${canEdit}" class="btn-link theme-primary btn-sm" th:href="@{/sources/{id}/edit(id=${source.id})}">编辑</a><form th:if="${canEdit}" class="d-inline" th:action="@{/sources/{id}/test(id=${source.id})}" method="post"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><button class="btn-outline theme-primary btn-sm" type="submit">测试连接</button></form></div></td></tr><tr th:if="${#lists.isEmpty(sources)}"><td colspan="6" class="text-center fg-2 py-7">暂无数据源，请先添加一个 MySQL 数据源。</td></tr></tbody></table></div></div></article>
  <div th:replace="~{fragments/pagination :: pagination}"></div>
</section></body>
</html>
